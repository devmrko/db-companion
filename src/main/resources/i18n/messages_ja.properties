aitest.help=ログインアカウント所有の有効なプロファイルを使用し、AI アシスタント設定とは別です。showsql または chat の後、生成 SQL を別途確認・実行できます。プロファイルを変更せず今回のみ conversation=false を適用します。最新の結果はログインセッションにのみ保持します。
