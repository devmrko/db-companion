sqlh.kinds=— マッピング・共有 SQL・AWR・監査ログを分けて表示します。収集範囲と保持期間は異なります。
sqlh.help=参照元のヘルプ
sqlh.help.cache=V$SQL の SELECT AI 原文と DBMS_CLOUD_AI.GENERATE の呼び出し形式を検索します。各行は子カーソルで、キャッシュから削除されると消えます。最終アクティブ時刻と累積実行数は個々の呼び出し履歴ではありません。解析スキーマは実行ユーザーではありません。
sqlh.match=検索種別
sqlh.match.all=すべて
sqlh.help.match=すべてでは SELECT AI で始まる文と DBMS_CLOUD_AI.GENERATE の呼び出し形式を検索し、監査ログではパッケージのイベントも含めます。原文による分類のため、文字列・コメント内の記述も一致し、動的 SQL やパッケージ内部の呼び出しは漏れる場合があります。バインドされた質問・プロファイルや応答は復元しません。アプリのテストも GENERATE ですが、ここで別途永続保存はしません。
sqlh.help.awr=DBA_HIST_SQLTEXT を SQLSTAT・SNAPSHOT と結合します。AWR は選ばれた SQL のみを収集し、漏れがあります。スナップショット終了時刻で絞り込み、観測区間は実際の実行時刻ではありません。回数は対象区間の EXECUTIONS_DELTA 合計です。対応する統計がない原文は表示されません。
sqlh.help.audit=SELECT AI 原文または DBMS_CLOUD_AI オブジェクトの既存監査記録です。パッケージイベントにはプロファイル変更も含まれ、SQL_ID はありません。戻りコード 0 は監査対象操作の成功であり、LLM や業務処理の成功を保証しません。バインド値・結果行は表示しません。ADB Serverless は既定で 14 日を超えた記録を削除するため、長期保存には Data Safe 等が必要です。
sqlh.access.cache=ログインアカウントの権限で参照します。ADMIN で SYS.V_$SQL の提供状況と必要な READ 権限を確認してください。ORA-00942 だけではビュー不在と権限不足を区別できません。
sqlh.access.awr=管理者が DBA_HIST_SQLTEXT・DBA_HIST_SQLSTAT・DBA_HIST_SNAPSHOT の参照権限と、契約上の AWR/Diagnostics Pack 利用範囲を確認してください。アクセス可能でもライセンス確認済みとは限りません。
sqlh.access.audit=管理者が UNIFIED_AUDIT_TRAIL・AUDIT_UNIFIED_POLICIES・AUDIT_UNIFIED_ENABLED_POLICIES の参照権限を確認してください。AUDIT_VIEWER は広範な監査情報を参照できるため、付与範囲の検討が必要です。アプリは権限・ポリシーを変更しません。
sqlh.help.common=最大 31 日・1 ページ 10 件です。同じ条件はセッション内で再利用し、更新ボタンで再取得します。原文は選択時に取得します。0 件でも呼び出しがなかったとは限りません。この画面では SQL 原文や AI を実行しません。
