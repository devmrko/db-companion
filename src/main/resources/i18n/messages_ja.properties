ontology.wizard.genericHelp=意味・役割・値の表現・名称列・利用基準を直接入力するか、ウィザードで提案を取得します。役割はコード・名称・識別子・数量・金額・日時などで、列名や型だけでは判定しません。承認済み定義をJSON/RDFで渡し、質問に既に含まれるコードの検索列を選ぶために使います。値ごとの辞書は必須ではありません。既存の草案保存・承認保存ボタンを使用します。
