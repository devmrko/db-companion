aitest.evHelp=保存された RDF/JSON から SKOS 名称・別名も使って関連経路を検索します。選択した根拠とバージョンを SQL 生成・プロンプト表示・AI レビューで共用します。草案の定義と機密列は根拠から除外し、プロファイル設定・object_list は変更しません。
