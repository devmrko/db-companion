ontology.terms.help=選択した保存版の業務概念と列の代表名・別名を SKOS で表します。代表名は prefLabel、別名は altLabel です。登録済み表現や参照先名を部分一致で検索し、LLM は呼び出しません。同じ別名の概念も統合しません。参照先を押すとトリプルを確認できます。列の用語は列定義ウィザードで確認・保存します。草案は承認済み定義ではありません。SKOS ラベルから新しい業務関係や事実は作りません。
ontology.values.title=値・用語マッピング（任意）
ontology.values.optionalHelp=特定の値に業務用語を対応付ける場合のみ使用します。全値の登録は不要です。列全体の意味は列定義ウィザードで定義します。
ontology.values.help=業務用語を実際の列・コード値に対応付けます。コード・代表名・別名は選択スキーマの DBC_ONTOLOGY_CATALOG.PAYLOAD にバージョン別JSONで保存されます。下書き保存は保管のみ、承認保存は文書全体の承認です。承認済みの対応のみを質問の根拠に使います。取得はローカル通常表・検証済み単純ビューの最大20行で、全コードや一意性を保証しません。機密値・長すぎる値は除外します。取得だけでは保存やAI呼び出しは行いません。
