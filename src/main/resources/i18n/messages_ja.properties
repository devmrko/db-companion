selectAiSetup.title=Select AI の開始ガイド
selectAiSetup.scope=前提条件: DB 権限、OCI compartment/region、IAM、ネットワーク、サービスのモデル対応を管理者と公式モデル一覧で確認してください。この画面はモデル名、既定値、リージョン対応を確定しません。
selectAiSetup.resourcePrincipal=Resource Principal
selectAiSetup.resourcePrincipalText=OCI$RESOURCE_PRINCIPAL は CREATE_CREDENTIAL で手動作成する API key ではありません。tenancy 管理者が dynamic group と最小権限 IAM ポリシーを構成した後、ADMIN が database resource principal を有効化し、必要に応じて DB ユーザーへ有効化します。存在・参照可能でも外部接続成功を意味しません。
selectAiSetup.resourcePrincipalSql=-- ADMIN only; changes database configuration. Do not run from this app.\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL();\n\n-- ADMIN can enable a DB user explicitly:\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL(username => '<DB_USER>');\n\n-- Read-only verification, subject to dictionary privilege:\nSELECT owner, credential_name FROM dba_credentials\n WHERE credential_name = 'OCI$RESOURCE_PRINCIPAL';
selectAiSetup.apiKey=API signing key
selectAiSetup.apiKeyText=OCI IAM ユーザー用の PEM RSA key pair（SSH key ではありません）を作成し、public key を IAM にアップロードします。signing-key overload には User OCID、tenancy OCID、fingerprint、パスフレーズなしの private PEM を個別の引数として渡します。このアプリは private key を収集・保存・作成しません。
selectAiSetup.apiKeySql=-- IAM 設定と明示的な承認後にのみ実行します。placeholder のみ使用します。\nBEGIN\n  DBMS_CLOUD.CREATE_CREDENTIAL(\n    credential_name => '<CREDENTIAL_NAME>',\n    user_ocid       => '<USER_OCID>',\n    tenancy_ocid    => '<TENANCY_OCID>',\n    private_key     => '<PRIVATE_KEY_PEM>',\n    fingerprint     => '<FINGERPRINT>');\nEND;\n/
selectAiSetup.profile=Profile の作成・確認
selectAiSetup.profileText=provider、credential_name、model、object_list と OCI provider の region/compartment 範囲を文書とサービスコンソールで確認します。明示オプションと DB 既定値を区別し、不明な既定値を正常・異常と判定しません。作成、セッション有効化、SHOWSQL、任意の read-only 実行は別の手順です。
selectAiSetup.profileSql=-- 1. CREATE_PROFILE は DB 設定を作成します。このアプリでは実行しません。\nBEGIN DBMS_CLOUD_AI.CREATE_PROFILE(\n  profile_name => '<PROFILE_NAME>',\n  attributes => '{"provider":"oci","credential_name":"<CREDENTIAL_NAME>","model":"<MODEL>","object_list":[{"owner":"<SCHEMA>","name":"<TABLE>"}]}'); END;\n/\n-- 2. SET_PROFILE は現在の stateful session のみに影響します。\nEXEC DBMS_CLOUD_AI.SET_PROFILE('<PROFILE_NAME>');\n-- 3. SHOWSQL は外部 AI 呼び出し/費用が発生する場合があり、SQL 正しさを保証しません。\nSELECT AI SHOWSQL '<QUESTION>';\n-- Read-only catalog check:\nSELECT attribute_name, attribute_value FROM user_cloud_ai_profile_attributes WHERE profile_name = '<PROFILE_NAME>' ORDER BY attribute_name;
selectAiSetup.limits=認証、権限、モデル、許可オブジェクトの失敗では、元の ORA コードと失敗段階を併せて確認してください。ORA-00942 はオブジェクト不在または権限不足の可能性があり、AI 生成成功も正しさの証明ではありません。このガイドは OCI ポリシー、key、credential、profile を変更せず、課金呼び出しも行いません。
