sqlh.policies.note=DBMS_CLOUD_AI を直接対象にするポリシーのみ表示します。ENABLED_OPTION と ENTITY_NAME を合わせて確認してください。EXCEPT USER は除外対象です。この一覧だけで全呼び出しの監査は保証できません。
sqlh.policies.empty=このパッケージを直接対象とするポリシーはありません。他の監査ポリシーは別途確認が必要です。
sqlh.policies.failed=ポリシーを確認できませんでした。監査ログの参照とは別の権限です。
sqlh.policies.more=ポリシーが 200 件を超えています。DB で全件を確認してください。
