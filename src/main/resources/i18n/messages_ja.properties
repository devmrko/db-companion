credentials.help=選択スキーマの Credential と DB 権限で確認できる参照先を表示します。\n\n用途は Select AI の LLM 呼び出し、ベクトル埋め込み、DB Link、Object Storage のロード・エクスポート、外部 API、リモート・外部 Scheduler ジョブなどです。Cloud 用と Vector 用では認証形式が異なる場合があります。\n\n選択スキーマのプロファイル credential_name、Tool の credential_name/tool_params.credential_name、DB Link と Scheduler の明示的な参照のみ確認します。他スキーマ、動的 PL/SQL、一時的な埋め込み・Object Storage 呼び出しは追跡しません。参照 0 件は未使用の証明ではありません。\n\nユーザー・説明情報には認証 JSON が含まれる場合があるため形式のみ表示します。パスワード・トークン・キー・Credential JSON 原文は取得しません。\n\n一覧と詳細はログインセッションにキャッシュします。この画面の更新ボタンで再取得します。接続テストや作成・変更・削除は実行しません。
