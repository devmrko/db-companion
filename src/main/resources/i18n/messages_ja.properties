ontology.rdf.help=保存済みのテーブル・列・キーと説明からアプリが RDF を生成します。主語・述語・目的語の1行がトリプルです。IRI は識別子で、Web リンクではありません。同名や同じコメントだけで概念を統合しません。メタデータの RDF であり、業務行の変換、RDF DB への格納、意味クエリの実行は行いません。
ontology.rdf.aiHelp=AI 草案は選択したアシスタントで業務概念と説明だけを提案します。確認して新しい草案に保存すると RDF に反映されます。識別子・エンコード・構文はアプリが処理します。AI 呼出しは送信内容の確認と同意後のみです。
