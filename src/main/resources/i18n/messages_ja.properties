dds.help=Grant・ロール・外部グループ\n• 通常の Data Grant は複数の DDS ロールに付与でき、各ロールも複数の Grant を受け取れます。\n• DDS ロールの外部 IAM ロール・グループへの対応は最大 1 件です。ローカルロールには外部マッピングがありません。DDS ロールは通常の DB ロールとは異なります。\n\n例：2 つのグループに同じ権限を適用\n共通 Data Grant → ROLE_A ↔ 外部グループ A\n共通 Data Grant → ROLE_B ↔ 外部グループ B\nTO ROLE_A, ROLE_B を指定します。対象オブジェクト・権限・条件が同じなら Grant の複製は不要です。\n注：クロステーブル Grant は TO 句を使わず、親オブジェクトの権限からアクセスを導出します。\n\nロールとマッピングは DB 全体、Data Grant は選択した対象スキーマの範囲です。保存された定義を表示し、最終的な有効権限は計算しません。更新ボタンで一覧と参照可否を再取得します。
