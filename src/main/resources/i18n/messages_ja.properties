archive.limits=同じインスタンス・コンテナ・SQL ID・子カーソル・ロード時刻は1行を更新し、再ロードは別行です。実行数は観測時の累計値で、収集ごとに加算しません。全RACインスタンス・毎実行の監査ログではありません。SQLマッピング・バインド値・AI応答・結果行は保存しません。
archive.privacy=SQL原文に機密リテラルが含まれる場合があります。ログイン所有スキーマに保存し自動削除しません。容量と閲覧権限を管理してください。アプリは自動で権限付与しません。
archive.savedNote=DBC_SQL_CACHE_ARCHIVEを参照し、V$SQLから消えた後も閲覧できます。日付は最終観測時刻（UTC）で、実行日時とは異なります。
