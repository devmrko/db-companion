scheduler.help=選択スキーマの DBMS_SCHEDULER ジョブを参照します。自分のスキーマは USER、他のスキーマは DBA または参照可能な ALL ビューを使用します。一覧・設定・ソース・実行履歴はセッションに保持し、画面の更新ボタンでまとめて更新します。状態は表示された取得時点のものです。ソースは現在の定義であり、過去の実行時点のコードではありません。参照 Program の実行内容も取得します。Chain ステップ、Window 詳細、外部ファイル、Synonym・DB link は展開しません。履歴は DB に保存されているログを10件ずつ取得し、ログ設定や保持期間により記録がない場合があります。エラー・出力は DB のテキストのみ表示し BINARY 出力は読みません。実行・停止・変更・外部送信は行いません。以下は参照専用 SQL です。
