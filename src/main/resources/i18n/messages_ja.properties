vpd.help=選択スキーマのテーブル・ビューの VPD ポリシーを表示します。変更には所有権と確認可能な DBMS_RLS EXECUTE 権限が必要です。
vpd.loadFunctions=有効な関数を取得
vpd.functionHelp=既存の有効な (VARCHAR2, VARCHAR2) RETURN VARCHAR2 関数を選択します。ソース作成や直接実行はしません。シグネチャ確認は業務・セキュリティの正しさを保証しません。
vpd.columnsHelp=未選択の場合は全列が対象です。Cmd/Ctrl クリックで選択を解除できます。
vpd.optionsHelp=INSERT には update_check が必要です。ALL_ROWS は SELECT と指定列が必要で、行の除外ではなく機密値を NULL にします。
vpd.supported=対応範囲: 大文字の通常識別子とローカル SYS_DEFAULT ポリシー。グループ、namespace/attribute、継承、未知の属性は変更不可です。
vpd.impact=DB アクセスのセキュリティを変更します。登録・有効化は問合せや DML を遮断し、削除・無効化は保護を解除する可能性があります。Oracle は COMMIT し、ロールバックは保証されません。全利用者への影響を確認してください。
vpd.gapWarning=変更は DROP_POLICY → ADD_POLICY です。非原子的なため保護の空白が発生し、登録失敗でポリシーが消失する可能性があります。外部管理者の競合も完全には防げません。承認済み保守時間にアプリのトラフィックを停止してください。
vpd.recovery=復旧検討用 SQL
vpd.recoveryHelp=実行前に元の定義を保管してください。失敗時は ALL_POLICIES を先に確認し、DBA がこの SQL を検討します。ポリシーが存在する場合は ADD を再実行しないでください。自動復旧・再試行はありません。
vpd.targetConfirm=上記の対象 (schema.table.policy) を正確に入力
vpd.consent=対象、SQL、全利用者への影響を確認し、この変更を承認します。
vpd.gapConsent=保守時間とトラフィック停止を確認し、削除・再登録の保護空白、部分失敗、手動復旧のリスクを承認します。
vpd.empty=このオブジェクトに参照可能な VPD ポリシーはありません。
vpd.noTables=このスキーマに参照可能なテーブル・ビューはありません。
vpd.noFunctions=有効な関数シグネチャがありません。所有者、関数・パッケージの状態と参照権限を確認してください。
vpd.ownerOnly=他のスキーマは参照専用です。変更はログイン所有のテーブル・ビューのみです。
vpd.executeRequired=ポリシーは参照できますが、DBMS_RLS EXECUTE 権限を確認できないため変更を停止しました。DBA に確認してください。権限は自動付与しません。
vpd.unsupported=グループ、namespace/attribute、継承、追加属性または未対応設定をこのフォームでは保持できません。全属性を参照し、変更・削除は DBA が検討してください。
vpd.stale=ポリシー、テーブル、関数、スキーマの変更または確認期限切れです。再読込して新しい SQL を確認してください。
vpd.duplicate=同名のポリシーが既に存在します。
vpd.invalid=入力を確認してください。大文字の通常識別子のみ対応し、INSERT は update_check、ALL_ROWS は SELECT と指定列が必要です。
vpd.functionRequired=必要なシグネチャの有効な関数を確認できません。関数一覧を再読込してください。
vpd.confirmRequired=正確な対象とセキュリティ影響への同意が必要です。変更には保守・保護空白への同意も必要です。
vpd.uncertain=変更結果を確定できません。部分的に COMMIT された可能性があります。自動再試行せず、このログインでの追加変更を停止しました。一覧を再読込し、DBA が実状態と復旧 SQL を確認してから再ログインしてください。
vpd.blocked=以前の変更結果の確認が必要なため追加変更を停止しました。DBA 確認後に再ログインしてください。
vpd.success=変更後のポリシーメタデータが一致しました。実際の利用者別アクセスと関数の業務的正しさは別途検証が必要です。
vpd.accessRequired=VPD カタログの参照権限と DB 対応を確認してください。権限不足をポリシーなしとは表示しません。
vpd.readError=VPD メタデータを完全に取得できません。ポリシーなしと判断したり変更したりしないでください。
vpd.limit=カタログ取得上限を超えました。部分的な情報では変更できません。
vpd.tableMissing=選択したテーブル・ビューを現在のカタログで確認できません。
