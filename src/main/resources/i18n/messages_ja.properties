sqlh.detail.mappingMore=最大10件のマッピングを表示します。SQLマッピングタブで検索範囲を絞ってください。
sqlh.detail.cacheNote=共有カーソルの累積統計であり、検索期間や直近1回の所要時間ではありません。パースユーザーは最初のカーソル作成者で、各実行者の一覧ではありません。DB時間はパース・実行・フェッチを含み、並列処理時間が合算される場合があります。GENERATE呼び出しと生成SQLの実行時間は異なります。
sqlh.cache.scope=共有SQLはログインスキーマを初期条件にします。パーススキーマを空にすると参照可能な全スキーマを検索するため、時間がかかる場合があります。
