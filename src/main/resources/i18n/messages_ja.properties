ontology.query.help=保存した名前・別名・定義から質問の対象を探し、確認済みの関係を最大 3 段階つなぎます。選択した経路のテーブルと関係だけを AI 説明や SQL 生成に使用します。選択は定義の承認ではありません。下書きは検索にのみ使い、AI の根拠から除外します。RDF は実際の行データではありません。
ontology.query.skos=列の優先名（SKOS prefLabel）と別名（altLabel）を検索に使います。例えば「ユーザー識別子」の別名に「会員番号」を登録すると、その表現でも列を探せます。未登録の類義語の自動推論や関係の作成は行いません。別名は登録した列の範囲でのみ使います。
ontology.query.limits=SQL は別途確認してから実行します。初版はローカルテーブルの単一 SELECT・集計・確認済み結合のみ対応し、ビュー・外部テーブル・サブクエリは対象外です。上限は 200 行・40 列・セル 2,000 文字、SQL の制限時間は 15 秒です。結果の LLM 送信や永続履歴の保存は行いません。AI の業務解釈は根拠と照合してください。
