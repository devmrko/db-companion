sqlh.detail.mappingMissing=このSQL IDに対応する変換SQLはありません。共有SQLの原文だけではGENERATEの戻り値を復元できません。
sqlh.detail.mappingUnavailable=現在のアカウントではSQLマッピングを参照できません。生成SQLが存在しないという意味ではありません。
