sqlh.to.db=終了日 (DB)
sqlh.from.utc=開始日 (UTC)
sqlh.to.utc=終了日 (UTC)
sqlh.actor.cache=解析スキーマ
sqlh.actor.audit=DB ユーザー
sqlh.time.cache=最終アクティブ (DB)
sqlh.time.awr=スナップショット観測区間 (DB)
sqlh.time.audit=監査時刻 (UTC)
sqlh.count.cache=累積実行数
sqlh.count.awr=区間実行数合計
sqlh.count.audit=戻りコード
sqlh.kind=種別
sqlh.awr.allow=この DB の AWR 利用権・ライセンスを確認しました。
sqlh.start=条件を指定して検索してください。
sqlh.observed=取得日時
sqlh.failed=取得できませんでした。参照元の対応状況と権限を確認してください。
sqlh.empty=条件に一致する記録はありません。
sqlh.invalid=条件を確認してください。期間は最大 31 日で、AWR は利用確認が必要です。
sqlh.missing=記録がないか一覧が期限切れです。画面を更新してください。
sqlh.ambiguous=記録を一意に特定できません。一覧を更新してください。
sqlh.policies=パッケージ監査ポリシーを確認
sqlh.policies.note=DBMS_CLOUD_AI を直接対象にするポリシーのみ表示します。ENABLED_OPTION と ENTITY_NAME を合わせて確認してください。EXCEPT USER は除外対象です。この一覧だけで全呼び出しの監査は保証できません。
sqlh.policies.empty=このパッケージを直接対象とするポリシーはありません。他の監査ポリシーは別途確認が必要です。
sqlh.policies.failed=ポリシーを確認できませんでした。監査ログの参照とは別の権限です。
sqlh.policies.more=ポリシーが 200 件を超えています。DB で全件を確認してください。
