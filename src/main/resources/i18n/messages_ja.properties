ontology.wizard.helpTitle=? 標本と提案
ontology.wizard.help=通常のローカルテーブルから最大20列・10/20行を読み取ります。無作為標本や全体統計ではありません。パターン検査ですべての機密情報を検出できません。非機密列を選択し送信内容を確認してください。標本はアプリDBやブラウザストレージに保存しません。要求は10分で失効し、閉じるとサーバー標本を解放します。DB監査と提供者の保持方針は別です。提案は草案で、RDF構文と識別子はアプリが生成します。
