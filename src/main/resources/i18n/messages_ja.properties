ontology.archive.help=質問・根拠の版・経路・結果の場所は共通 JSON 記録に、RDF は Oracle RDF Graph に保存します。選択した根拠を CONSTRUCT で照会し、結果を別の名前付きグラフ ID で明示的に保存します。同じ経路で直前に作成した AI 説明または SQL も記録します。業務行と SQL 結果行は保存しません。自動推論や自然言語から SPARQL への変換は行いません。
