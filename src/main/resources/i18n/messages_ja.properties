external.schemaAclHelp=選択スキーマでは直接付与、入れ子ロール、PUBLIC と PUBLIC ロール経由の登録済み経路を表示します。同じロールの複数経路はユーザー/PUBLIC ごとに最短の代表経路を表示します。全 ACL はログインユーザーが参照可能な原文です。経路の確認には DBA_HOST_ACES と DBA_ROLE_PRIVS の参照権限が必要で、不足範囲は明示します。ロール付与や DEFAULT_ROLE=YES は実行時の有効化を保証しません。ロール有効化、PL/SQL の実行文脈、ホスト/ポート優先順位、ACE 順序・期間・反転を総合する実効権限判定ではありません。該当行がなくても接続拒否を意味しません。OCI NSG・セキュリティリスト・接続先の許可 IP は別途確認が必要です。更新時は ACL 原文と各スキーマの経路キャッシュを一緒に破棄します。以下の SQL は参照例です。
