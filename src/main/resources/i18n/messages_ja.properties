ontology.wizard.semanticsHelp=個々の値を登録せず、列全体の意味・役割・表記基準を定義します。コード列と名称列があれば一緒に選択してください。名称列の関連付けは表示名を探す手掛かりで、外部キーや1対1の関係を保証しません。10/20行では全コードや国・地域の基準を確定できません。不明な意味は確認事項に残します。確認後、既存の管理JSONに草案として保存し、元のコメントは変更しません。質問の根拠として選択した承認済み定義をRDFで渡します。質問に対応する実際の値を自動取得する機能ではありません。
