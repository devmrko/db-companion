catalogOps.confirm=以下の SQL でログインアカウントに登録します。
catalogOps.helpTitle=登録ヘルプ ?
catalogOps.help=既存の DB Link を DBMS_CATALOG.MOUNT_DB_LINK で登録します。リンクや認証情報は新規作成しません。ログインアカウントの private リンクまたは隠されていない PUBLIC リンクのみ対象です。登録は DB を変更し、API 内部コミットのロールバックは保証しません。登録成功はリモート参照成功ではありません。MySQL などの異種リンクは別途互換性確認が必要です。External Table は外部ソースのローカル定義なので再登録しません。
catalogOps.browse=メタデータを参照
catalogOps.browseHelpTitle=メタデータ参照ヘルプ
catalogOps.browseHelp=GET_SCHEMAS → GET_TABLES → GET_COLUMNS で選択範囲のみ参照します。リモート接続が発生する場合がありますが業務行は読みません。DB 既定設定により内部メタデータキャッシュや非同期収集ジョブが作られる場合があります。アプリは設定変更・事前取得・同期を行いません。画面更新はアプリのセッションキャッシュのみを消去します。上限は 5,000 行、各項目 8,192 文字、各段階合計 100 万文字です。
