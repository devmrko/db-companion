ontology.values.help=業務用語を実際の列・コード値に対応付けます。コード・代表名・別名は選択スキーマの DBC_ONTOLOGY_CATALOG.PAYLOAD にバージョン別JSONで保存されます。下書き保存は保管のみ、承認保存は文書全体の承認です。承認済みの対応のみを質問の根拠に使います。取得はローカル通常表の最大20行で、全コードや一意性を保証しません。機密値・長すぎる値は除外します。取得だけでは保存やAI呼び出しは行いません。
