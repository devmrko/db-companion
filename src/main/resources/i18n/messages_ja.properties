sqlh.cancelled.help=検索がキャンセルされたか、制限時間（10秒）を超えました。権限不足を意味しません。スキーマ・SQL ID・期間を絞って再検索してください。
sqlh.empty=条件に一致する記録はありません。
sqlh.invalid=条件を確認してください。期間は最大 31 日で、AWR は利用確認が必要です。
sqlh.missing=記録がないか一覧が期限切れです。画面を更新してください。
