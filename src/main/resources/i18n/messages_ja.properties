catalogOps.help=既存の DB Link を DBMS_CATALOG.MOUNT_DB_LINK で登録します。リンクや認証情報は新規作成しません。ログインアカウントの private リンクまたは隠されていない PUBLIC リンクのみ対象です。登録は DB を変更し、API 内部コミットのロールバックは保証しません。登録成功はリモート参照成功ではありません。MySQL などの異種リンクは別途互換性確認が必要です。External Table は外部ソースのローカル定義なので再登録しません。
