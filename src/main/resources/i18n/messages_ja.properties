aitest.executeHelp=ログイン権限で SQL を Oracle に渡します。アプリ独自の構文・関数・オブジェクト許可リストは適用しません。読取り専用トランザクション・最大 200 行・実行制限 120 秒を維持します。関数の独立トランザクションや外部呼出しまで拒否する機能ではないため、SQL を確認してください。結果は外部 AI に送信しません。
