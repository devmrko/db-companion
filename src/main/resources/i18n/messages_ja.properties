catalogOps.fieldHelpTitle={0}項目ヘルプ
catalogOps.commentHelp=説明・コメントはカタログ API の返却原文です。— は返却値が空であることを示し、元の DB にコメントがないとは限りません。長い内容はマウスを重ねると全文を確認できます。
catalogOps.commentUnavailable=現在のカタログ API はカラムコメント項目を提供していません。この結果から元の DB のコメントの有無は判断できません。
catalogOps.lengthHelp=長さ：カタログが返す DATA_LENGTH です。Oracle 辞書ではバイト単位で、異種 DB Link ではゲートウェイ変換後の値の場合があります。文字数や元の DB の定義長と一致するとは限りません。
catalogOps.precisionHelp=精度：数値全体の有効桁数です。NUMBER(10,2) は全体 10 桁、小数 2 桁で整数部は最大 8 桁です。FLOAT など型によって精度の単位が異なる場合があります。
catalogOps.scaleHelp=小数桁数：小数点以下の桁数です。0 は整数単位、2 は小数第 2 位までを表します。Oracle NUMBER の負数は小数点の左側で丸める指定です（-2 は百単位）。
catalogOps.listRequired=登録一覧を確認できません。更新してください。
