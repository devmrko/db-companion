ontology.terms.help=SKOS 表达所选已保存版本的业务概念及列的代表名称和别名。首选标签使用 prefLabel，替代表达使用 altLabel。按已登记表达或关联对象名称进行部分匹配，不调用 LLM。不会合并别名相同的概念。点击关联对象查看三元组。列术语在列定义向导中审核并保存。草稿不是已批准的定义。SKOS 标签不会创建新的业务关系或事实。
