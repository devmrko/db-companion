dds.help=授权 · 角色 · 外部组\n• 一个普通 Data Grant 可以授予多个 DDS 角色，一个角色也可以接收多个授权。\n• 每个 DDS 角色最多映射一个外部 IAM 角色或组。本地角色没有外部映射。DDS 角色不同于普通数据库角色。\n\n示例：两个组共享相同权限\n共享 Data Grant → ROLE_A ↔ 外部组 A\n共享 Data Grant → ROLE_B ↔ 外部组 B\n指定 TO ROLE_A, ROLE_B。目标对象、权限和条件相同时，无需复制授权。\n注意：跨表授权不使用 TO 子句，而是根据父对象权限派生访问权限。\n\n角色和映射属于数据库级范围；Data Grant 按所选目标架构筛选。此处显示已保存的定义，不计算最终有效权限。刷新按钮用于更新列表和访问状态。
