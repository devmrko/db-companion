sqlh.help=来源说明
sqlh.help.cache=在 V$SQL 中查找 SELECT AI 原文和 DBMS_CLOUD_AI.GENERATE 调用形式。每行是子游标，缓存清除后消失。最后活动时间与累计执行次数不是逐次调用记录；解析方案不是执行用户。
