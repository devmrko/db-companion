ontology.rdf.help=应用根据已保存版本的表、列、键和说明生成 RDF。每个主语–谓语–宾语行是一个三元组。IRI 是标识符，不是网页链接。不会因名称或注释相同而合并概念。这是元数据 RDF，不转换业务行、不加载 RDF 数据库，也不执行语义查询。
ontology.rdf.aiHelp=AI 草稿通过所选助手配置仅建议业务概念和说明。审核并另存为草稿后才反映到 RDF。标识符、编码和语法由应用代码处理。AI 调用需先查看发送内容并同意。
