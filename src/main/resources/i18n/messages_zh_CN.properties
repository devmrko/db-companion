credentials.help=查询所选模式的凭据及 DB 权限允许查看的引用。\n\n用途包括 Select AI LLM 调用、向量嵌入、DB Link、Object Storage 加载与导出、外部 API 及远程/外部 Scheduler 作业。Cloud 与 Vector 凭据的认证格式可能不同。\n\n仅检查所选模式中配置文件的 credential_name、Tool 的 credential_name/tool_params.credential_name，以及 DB Link 和 Scheduler 的显式引用。不跟踪其他模式、动态 PL/SQL 或临时嵌入/Object Storage 调用。零引用不代表未使用。\n\n用户和说明信息可能含有认证 JSON，因此仅显示格式。不查询密码、令牌、密钥或原始凭据 JSON。\n\n列表和详情缓存在登录会话中，点击本页刷新按钮重新加载。不执行连接测试、创建、修改或删除。
