sqlh.help.match=全部会搜索以 SELECT AI 开头的语句和 DBMS_CLOUD_AI.GENERATE 调用形式；审计日志还包括包对象事件。分类基于原文：字符串或注释中的提及也可能匹配，动态 SQL 或包内部调用可能遗漏。不还原绑定传入的问题、配置名和响应。应用测试使用 GENERATE，但此处不另外永久保存。
sqlh.help.awr=关联 DBA_HIST_SQLTEXT、SQLSTAT 与 SNAPSHOT。AWR 仅收集选中的 SQL，可能遗漏。按快照结束时间筛选；观测区间不是执行时间。次数为对应区间的 EXECUTIONS_DELTA 之和。不含只有文本而无匹配统计的记录。
sqlh.help.audit=显示 SELECT AI 原文或 DBMS_CLOUD_AI 对象的现有审计记录。包事件也含配置修改，且不提供 SQL_ID。返回码 0 表示审计动作成功，不保证 LLM 或业务成功。不显示绑定值与结果行。ADB Serverless 默认清理超过 14 天的记录，长期保存需使用 Data Safe 等独立保留机制。
sqlh.access.cache=权限基于登录账户。请 ADMIN 确认 SYS.V_$SQL 是否可用及所需 READ 权限。仅凭 ORA-00942 无法区分视图不存在与权限不足。
sqlh.access.awr=管理员需确认 DBA_HIST_SQLTEXT、DBA_HIST_SQLSTAT、DBA_HIST_SNAPSHOT 读取权限及服务合同中的 AWR/Diagnostics Pack 使用权。可访问不代表已获许可。
sqlh.access.audit=管理员需确认 UNIFIED_AUDIT_TRAIL、AUDIT_UNIFIED_POLICIES 与 AUDIT_UNIFIED_ENABLED_POLICIES 的读取权限。AUDIT_VIEWER 可查看广泛审计信息，授权前应审查范围。本应用不修改权限或策略。
sqlh.help.common=最多查询 31 天，每页 10 条。相同条件复用会话结果，点击刷新重新获取；选择记录时重新读取完整原文。无结果不代表未调用。本页面不会执行原文 SQL 或 AI 调用。
