selectAiSetup.title=Select AI 入门
selectAiSetup.scope=前提条件：请与管理员及官方模型列表确认 DB 权限、OCI compartment/region、IAM、网络和服务的模型支持。本页面不确认模型名称、默认值或区域支持。
selectAiSetup.resourcePrincipal=Resource Principal
selectAiSetup.resourcePrincipalText=OCI$RESOURCE_PRINCIPAL 不是用 CREATE_CREDENTIAL 手动创建的 API key。tenancy 管理员配置 dynamic group 和最小 IAM 策略后，ADMIN 启用数据库 resource principal，必要时向 DB 用户启用。存在或可见不代表外部连接成功。
selectAiSetup.resourcePrincipalSql=-- ADMIN only; changes database configuration. Do not run from this app.\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL();\n\n-- ADMIN can enable a DB user explicitly:\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL(username => '<DB_USER>');\n\n-- Read-only verification, subject to dictionary privilege:\nSELECT owner, credential_name FROM dba_credentials\n WHERE credential_name = 'OCI$RESOURCE_PRINCIPAL';
selectAiSetup.apiKey=API signing key
selectAiSetup.apiKeyText=为 OCI IAM 用户创建 PEM RSA 密钥对（不是 SSH key）并将 public key 上传到 IAM。signing-key overload 将 User OCID、tenancy OCID、fingerprint 和未加密 private PEM 分别作为参数。本应用绝不收集、存储或创建 private key。
selectAiSetup.apiKeySql=-- 仅在完成 IAM 设置并获得明确批准后执行。仅使用占位符。\nBEGIN\n  DBMS_CLOUD.CREATE_CREDENTIAL(\n    credential_name => '<CREDENTIAL_NAME>',\n    user_ocid       => '<USER_OCID>',\n    tenancy_ocid    => '<TENANCY_OCID>',\n    private_key     => '<PRIVATE_KEY_PEM>',\n    fingerprint     => '<FINGERPRINT>');\nEND;\n/
selectAiSetup.profile=创建并验证 Profile
selectAiSetup.profileText=请在文档和服务控制台中确认 provider、credential_name、model、object_list 及 OCI provider 的 region/compartment 范围。区分显式选项与 DB 默认值；未知默认值不代表正常或异常。创建、会话激活、SHOWSQL 和可选 read-only 执行是独立步骤。
selectAiSetup.profileSql=-- 1. CREATE_PROFILE 会创建 DB 配置。请勿在本应用中执行。\nBEGIN DBMS_CLOUD_AI.CREATE_PROFILE(\n  profile_name => '<PROFILE_NAME>',\n  attributes => '{"provider":"oci","credential_name":"<CREDENTIAL_NAME>","model":"<MODEL>","object_list":[{"owner":"<SCHEMA>","name":"<TABLE>"}]}'); END;\n/\n-- 2. SET_PROFILE 仅影响当前 stateful session。\nEXEC DBMS_CLOUD_AI.SET_PROFILE('<PROFILE_NAME>');\n-- 3. SHOWSQL 可能调用外部 AI/产生费用，且不证明 SQL 正确。\nSELECT AI SHOWSQL '<QUESTION>';\n-- Read-only catalog check:\nSELECT attribute_name, attribute_value FROM user_cloud_ai_profile_attributes WHERE profile_name = '<PROFILE_NAME>' ORDER BY attribute_name;
selectAiSetup.limits=对于认证、授权、模型或允许对象失败，请同时检查原始 ORA 代码和失败阶段。ORA-00942 可能表示对象不存在或权限不足，成功的 AI 生成也不证明结果正确。本指南不更改 OCI 策略、密钥、credential 或 profile，也不产生计费调用。
