ontology.values.help=将业务术语关联到实际列及代码值。代码、首选名称和别名按版本以 JSON 保存在所选架构的 DBC_ONTOLOGY_CATALOG.PAYLOAD 中。保存草稿仅保留内容；批准会批准整个文档。仅已批准映射用于问题依据。查询最多读取本地普通表或已验证简单视图的20行，不保证完整性或唯一性。排除敏感或过长的值。查询不会保存或调用AI。
