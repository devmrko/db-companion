catalogOps.help=Registers an existing DB Link with DBMS_CATALOG.MOUNT_DB_LINK. No new link or credential is created. Only the signed-in account's private links or unshadowed PUBLIC links are eligible. Registration changes the DB; the app cannot guarantee rollback of internal API commits. Registration does not prove remote access. Heterogeneous links such as MySQL need separate compatibility checks. External Tables are already local definitions of external sources and are not registered again here.
