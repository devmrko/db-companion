ontology.terms.helpTitle=SKOS term help
ontology.terms.help=SKOS represents the saved version's business concept and column labels and aliases. Preferred labels use prefLabel and alternatives use altLabel. Search matches part of a registered expression or source name without an LLM call. Concepts sharing an alias are not merged. Select a source to inspect its triples. Review and save column terms in the column definition wizard. Drafts are not approved definitions. SKOS labels do not create new business relationships or facts.
ontology.values.title=Value terminology (optional)
ontology.values.optionalHelp=Use only when a particular value needs a business term. You do not need to register every value. Use the column definition wizard to define the meaning of a column as a whole.
ontology.values.help=Map business terms to actual columns and codes. Codes, preferred labels and aliases are stored as versioned JSON in the selected schema’s DBC_ONTOLOGY_CATALOG.PAYLOAD. Save draft only retains them; approve approves the entire document. Only approved mappings enter question evidence. Lookup reads at most 20 rows from a local ordinary table, not a complete or uniqueness-verified code list. Sensitive or oversized values are excluded. Lookup neither saves nor calls AI.
