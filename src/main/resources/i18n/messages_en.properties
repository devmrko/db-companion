ontology.rdf.helpTitle=RDF generation help
ontology.rdf.help=The app generates RDF from a saved version of table, column and key metadata and descriptions. Each subject–predicate–object row is a triple. IRIs are identifiers, not web links. Matching names or comments do not merge concepts. This is metadata RDF, not business-row conversion, RDF database loading or semantic query execution.
