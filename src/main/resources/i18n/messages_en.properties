credentials.help=Lists credentials in the selected schema and references visible with your DB privileges.\n\nUses include Select AI LLM calls, vector embeddings, DB links, Object Storage loading/export, external APIs and remote/external Scheduler jobs. Cloud and Vector credentials may use different authentication formats.\n\nReferences cover only explicit profile credential_name, Tool credential_name/tool_params.credential_name, DB link and Scheduler references in the selected schema. Other schemas, dynamic PL/SQL and one-off embedding/Object Storage calls are not tracked. Zero references does not prove a credential is unused.\n\nUsername and comments may contain authentication JSON, so only their format is shown. Passwords, tokens, keys and raw credential JSON are not queried.\n\nLists and details are cached in your login session. Use this page's refresh button to reload them. No connection tests, creation, updates or deletion are performed.
