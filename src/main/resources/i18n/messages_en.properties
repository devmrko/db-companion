selectAiSetup.title=Getting started with Select AI
selectAiSetup.scope=Prerequisites: verify DB privileges, OCI compartment/region, IAM, networking, and model support for the service with an administrator and the official model list. This screen does not confirm model names, defaults, or regional support.
selectAiSetup.resourcePrincipal=Resource Principal
selectAiSetup.resourcePrincipalText=OCI$RESOURCE_PRINCIPAL is not an API key to create with CREATE_CREDENTIAL. After a tenancy administrator configures a dynamic group and least-privilege IAM policy, ADMIN enables the database resource principal and can enable a DB user. Existence or visibility does not prove an external connection.
selectAiSetup.resourcePrincipalSql=-- ADMIN only; changes database configuration. Do not run from this app.\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL();\n\n-- ADMIN can enable a DB user explicitly:\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL(username => '<DB_USER>');\n\n-- Read-only verification, subject to dictionary privilege:\nSELECT owner, credential_name FROM dba_credentials\n WHERE credential_name = 'OCI$RESOURCE_PRINCIPAL';
selectAiSetup.apiKey=API signing key
selectAiSetup.apiKeyText=Create a PEM RSA key pair for the OCI IAM user (not an SSH key) and upload the public key to IAM. The signing-key overload takes User OCID, tenancy OCID, fingerprint, and an unencrypted private PEM as separate arguments. This app never collects, stores, or creates private keys.
selectAiSetup.apiKeySql=-- Run only after IAM setup and explicit approval. Placeholder values only.\nBEGIN\n  DBMS_CLOUD.CREATE_CREDENTIAL(\n    credential_name => '<CREDENTIAL_NAME>',\n    user_ocid       => '<USER_OCID>',\n    tenancy_ocid    => '<TENANCY_OCID>',\n    private_key     => '<PRIVATE_KEY_PEM>',\n    fingerprint     => '<FINGERPRINT>');\nEND;\n/
selectAiSetup.profile=Create and verify a profile
selectAiSetup.profileText=Verify provider, credential_name, model, object_list, and any OCI provider region/compartment scope in documentation and the service console. Distinguish explicit options from DB defaults; an unknown default is not healthy or unhealthy. Creation, session activation, SHOWSQL, and an optional read-only execution are separate steps.
selectAiSetup.profileSql=-- 1. CREATE_PROFILE creates DB configuration. Do not run it from this app.\nBEGIN DBMS_CLOUD_AI.CREATE_PROFILE(\n  profile_name => '<PROFILE_NAME>',\n  attributes => '{"provider":"oci","credential_name":"<CREDENTIAL_NAME>","model":"<MODEL>","object_list":[{"owner":"<SCHEMA>","name":"<TABLE>"}]}'); END;\n/\n-- 2. SET_PROFILE affects the current stateful session only.\nEXEC DBMS_CLOUD_AI.SET_PROFILE('<PROFILE_NAME>');\n-- 3. SHOWSQL can call external AI/incur cost and does not prove SQL correctness.\nSELECT AI SHOWSQL '<QUESTION>';\n-- Read-only catalog check:\nSELECT attribute_name, attribute_value FROM user_cloud_ai_profile_attributes WHERE profile_name = '<PROFILE_NAME>' ORDER BY attribute_name;
selectAiSetup.limits=For authentication, authorization, model, or allowed-object failures, inspect the original ORA code together with the failed stage. ORA-00942 can mean a missing object or insufficient privilege, and successful AI generation is not proof of correctness. This guide does not change OCI policies, keys, credentials, or profiles, and does not make billed calls.
