sqlh.help=Source help
sqlh.help.cache=Finds SELECT AI text and DBMS_CLOUD_AI.GENERATE call forms in V$SQL. Each row is a child cursor and disappears on eviction. Last active time and cumulative executions are not individual execution events. Parsing schema is not the execution user.
sqlh.match=SQL type
sqlh.match.all=All
sqlh.help.match=All searches statements starting with SELECT AI and DBMS_CLOUD_AI.GENERATE call forms; audit logs also include package-object events. Classification is text-based: mentions in strings or comments may match, while dynamic SQL and internal package calls may be missed. Questions and profiles passed as binds, and responses, are not reconstructed. App tests use GENERATE but are not separately archived here.
sqlh.help.awr=Joins DBA_HIST_SQLTEXT with SQLSTAT and SNAPSHOT. AWR captures selected SQL, not every call. Filters by snapshot end time; the observed interval is not an execution timestamp. Counts sum EXECUTIONS_DELTA for those intervals. Text without matching statistics is not listed.
sqlh.help.audit=Existing audit events for SELECT AI text or the DBMS_CLOUD_AI object. Package events also include profile changes; SQL_ID is unavailable. Return code 0 indicates audit-action success, not LLM or business success. Bind values and result rows are not shown. ADB Serverless purges records older than 14 days by default; use separate retention such as Data Safe for longer storage.
sqlh.access.cache=Access uses the login account. Ask ADMIN to verify SYS.V_$SQL availability and required READ access. ORA-00942 alone cannot distinguish a missing view from insufficient privileges.
sqlh.access.awr=An administrator must check read access to DBA_HIST_SQLTEXT, DBA_HIST_SQLSTAT, and DBA_HIST_SNAPSHOT, plus AWR/Diagnostics Pack entitlement under the service contract. Technical access does not establish licensing rights.
sqlh.access.audit=An administrator must verify read access to UNIFIED_AUDIT_TRAIL, AUDIT_UNIFIED_POLICIES, and AUDIT_UNIFIED_ENABLED_POLICIES. AUDIT_VIEWER provides broad audit visibility; review its scope before granting it. This app does not change privileges or policies.
sqlh.help.common=Up to 31 days, 10 rows per page. Repeated filters reuse session results; use Refresh to reload. Full text is fetched when selected. No rows does not mean no calls occurred. This screen never executes SQL text or AI calls.
