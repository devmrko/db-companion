scheduler.helpTitle=Scheduler help
scheduler.help=Read DBMS_SCHEDULER jobs for the selected schema. Uses USER views for the login's schema and DBA or accessible ALL views for other schemas. Lists, settings, source and run history are session snapshots; the page Refresh button updates them together. Status is as of the displayed retrieval time. Source is the current definition, not code archived at the time of a past run. Referenced Programs are resolved. Chain steps, Window details, external files, synonyms and database links are not expanded. Run history reads retained DB logs in pages of ten; logging settings and retention may leave no records. Only DB-provided text errors and output are shown, not BINARY output. No jobs are run, stopped, modified or sent externally. The SQL below is read-only.
