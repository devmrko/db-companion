ontology.query.title=Ontology query
ontology.query.helpTitle=Query help
ontology.query.help=Match the question to saved names, aliases and definitions, then connect verified relationships across up to 3 edges. Select a path to use only its tables and relationships for an AI explanation or SQL. Selection does not approve stored definitions. Drafts help retrieval but are excluded from AI evidence. RDF is not actual row data.
ontology.query.skos=Search uses column preferred labels (SKOS prefLabel) and alternative labels (altLabel). For example, registering ‘member number’ as an alias of ‘user identifier’ lets that phrase find the column too. It does not infer unregistered synonyms or create relationships. Aliases apply only to the column where they are registered.
ontology.query.limits=SQL runs only after a separate review. This version supports a single SELECT, aggregates and verified joins on local tables; views, external tables and subqueries are excluded. Limits: 200 rows, 40 columns, 2,000 characters per cell and a 15-second statement timeout. Results are not sent to an LLM or saved in permanent history. Check the AI interpretation against its evidence.
