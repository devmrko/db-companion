vpd.functionHelp=Select an existing valid (VARCHAR2, VARCHAR2) RETURN VARCHAR2 function. No source is created or invoked directly. A valid signature does not establish business or security correctness.
vpd.columnsHelp=No selection means all columns. Cmd/Ctrl-click to deselect.
vpd.optionsHelp=INSERT requires update_check. ALL_ROWS requires SELECT and selected columns; it masks sensitive values as NULL instead of filtering rows.
vpd.supported=Supported: uppercase unquoted identifiers and local SYS_DEFAULT policies. Groups, namespace/attribute links, inheritance and unknown fields block changes.
vpd.impact=This changes database access security. Add/enable can block queries or DML; delete/disable can remove protection. Oracle commits these calls; rollback is not guaranteed. Review effects on all users.
vpd.gapWarning=Replacement is DROP_POLICY then ADD_POLICY. It is not atomic: a security gap exists between calls and failed ADD can leave no policy. External administrative races cannot be eliminated. Stop application traffic during an approved maintenance window.
vpd.recovery=SQL for recovery review
vpd.recoveryHelp=Keep the original definition before execution. On failure, inspect ALL_POLICIES first and have a DBA review this SQL. Do not rerun ADD if the policy exists. Recovery and retries are never automatic.
vpd.targetConfirm=Type the exact target (schema.table.policy) above
vpd.consent=I reviewed the target, SQL and security impact on all users and approve this change.
vpd.gapConsent=I confirmed the maintenance window and stopped traffic, and accept the security gap, partial failure and manual recovery risks of replacement.
vpd.empty=No visible VPD policies on this object.
vpd.noTables=No visible tables or views in this schema.
vpd.noFunctions=No valid function signature found. Check owner, function/package status and visibility.
vpd.ownerOnly=Other schemas are read-only. Changes are limited to tables and views owned by the login.
vpd.executeRequired=Policies can be inspected, but changes are blocked because a DBMS_RLS EXECUTE grant could not be confirmed. Ask your DBA; no grants are applied automatically.
vpd.unsupported=Groups, namespace/attribute links, inheritance, extra fields or unsupported settings cannot be preserved by this form. Inspect the full properties and have a DBA review changes/deletion.
vpd.stale=Policy, table, function or schema changed, or confirmation expired. Refresh and review new SQL.
vpd.duplicate=A policy with this name already exists.
vpd.invalid=Check inputs. Use uppercase unquoted identifiers; INSERT requires update_check, and ALL_ROWS requires SELECT with selected columns.
vpd.functionRequired=The policy function is not currently valid/visible with the required signature. Reload functions.
vpd.confirmRequired=Exact target and security consent are required. Replacement also requires maintenance/security-gap consent.
vpd.uncertain=The result of the change could not be confirmed. Partial changes may have committed. No automatic retry; further changes in this login are blocked. Refresh the list and have a DBA inspect actual state and original recovery SQL before logging in again.
vpd.blocked=Further changes are blocked in this login pending investigation of a previous change. Ask your DBA before logging in again.
vpd.success=The resulting policy metadata matches the confirmed operation. Row access for real users and function semantics require separate validation.
vpd.accessRequired=Check VPD dictionary access and database support. Missing access is not an empty policy list.
vpd.readError=Complete VPD metadata could not be read. Do not infer absence or apply changes.
