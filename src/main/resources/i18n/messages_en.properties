dds.help=Grants · roles · external groups\n• A regular Data Grant can be assigned to several DDS roles, and each role can receive several grants.\n• A DDS role maps to at most one external IAM role or group. Local roles have no external mapping. DDS roles differ from standard database roles.\n\nExample: the same access for two groups\nShared Data Grant → ROLE_A ↔ external group A\nShared Data Grant → ROLE_B ↔ external group B\nSpecify TO ROLE_A, ROLE_B. No duplicate grant is needed when the target object, privileges and predicate are the same.\nNote: cross-table grants derive access from parent privileges without a TO clause.\n\nRoles and mappings are database-wide; Data Grants use the selected target schema. These are stored definitions, not calculated effective access. Refresh reloads lists and access status.
