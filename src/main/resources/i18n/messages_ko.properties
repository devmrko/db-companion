external.schemaAclHelp=선택 스키마: DB에 기록된 직접 부여, 중첩 역할, PUBLIC과 PUBLIC 역할을 통한 경로를 표시합니다. 같은 역할의 여러 경로는 사용자/PUBLIC 출발점별 가장 짧은 대표 경로를 보여줍니다. 전체 ACL: 로그인 계정이 조회할 수 있는 원문입니다. 부여 경로 확인에는 DBA_HOST_ACES와 DBA_ROLE_PRIVS 조회 권한이 필요하며, 부족하면 미확인 범위를 표시합니다. 역할 부여나 DEFAULT_ROLE=YES가 실행 시 활성화를 보장하지 않습니다. 역할 활성화·PL/SQL 실행 문맥, 호스트/포트 우선순위, ACE 순서·기간·반전까지 판단한 실효 권한 화면은 아닙니다. 결과가 없어도 연결 차단을 뜻하지 않습니다. OCI NSG·보안 목록·대상 서버 허용 IP는 별도로 확인해야 합니다. 새로고침은 ACL 원문과 스키마별 경로 캐시를 함께 갱신합니다. 아래 SQL은 조회 예시입니다.
