ontology.consent=위 메타데이터의 외부 전송과 AI 사용량 발생을 확인했습니다.
ontology.aiMetadata=저장된 메타데이터만 사용합니다. 전송 내용을 확인해 주세요.
ontology.generate=초안 생성
ontology.reviewAi=AI 제안입니다. 저장 전 원본과 대조해 주세요.
