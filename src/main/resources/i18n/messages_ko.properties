ontology.context.rawResponse=AI 응답 원문
ontology.context.rawHelp=검사를 통과하지 못한 응답입니다. 저장·자동 재호출하지 않았습니다. 원문은 이 창에서만 표시하며 닫으면 지웁니다.
ontology.context.response.EMPTY=AI 응답이 비어 있습니다. 저장하지 않았습니다.
ontology.context.response.SIZE=AI 응답이 처리 한도를 넘었습니다. 원문을 표시하거나 저장하지 않았습니다.
ontology.context.response.JSON=AI 응답이 올바른 JSON이 아닙니다. ‘AI 응답 원문’을 확인해 주세요. 저장하지 않았습니다.
ontology.context.response.ROOT=AI 응답에 suggestions 배열만 있는 JSON 객체가 필요합니다. 저장하지 않았습니다.
ontology.context.response.COUNT=AI 추천 수가 현재 수정 가능한 항목 수를 넘었습니다. 다른 테이블의 FK는 참고용입니다. 저장하지 않았습니다.
ontology.context.response.ITEM=추천 항목에는 field·name·value·reason·uncertainty 다섯 필드가 필요합니다. 저장하지 않았습니다.
ontology.context.response.TYPE=추천 필드가 문자열이 아닙니다. 원문의 표시 위치를 확인해 주세요. 저장하지 않았습니다.
ontology.context.response.SCOPE=현재 수정 범위 밖의 추천입니다. 업무명·설명의 name은 빈 문자열, 관계는 대상 테이블이 소유한 FK만 허용합니다. 저장하지 않았습니다.
ontology.context.response.DUPLICATE=같은 항목의 추천이 중복됐습니다. 저장하지 않았습니다.
ontology.context.response.VALUE=추천 정의가 비어 있습니다. 저장하지 않았습니다.
ontology.context.response.STYLE=추천이 길이·문체 기준을 벗어났습니다. 정의는 한 줄 80자, 근거·확인사항은 각각 한 줄 160자 이내여야 합니다. 저장하지 않았습니다.
ontology.context.sources=참조한 RDF
ontology.context.omitted=제외된 관계 (민감 컬럼·미수집·범위 밖)
ontology.context.noSampling=저장된 RDF 기준 · 샘플 재조회 없음
ontology.context.adopt=채택
ontology.context.proposed=추천 정의
ontology.context.reason=근거
ontology.context.uncertainty=확인할 사항
ontology.context.evidence=AI 분석 근거
ontology.context.historical=채택 당시의 기록입니다. 이후 직접 편집한 값과 다를 수 있습니다.
ontology.context.limit=연결된 RDF가 분석 한도를 넘습니다 (최대 10개 문서, 64,000자). 자동으로 일부만 분석하지 않았습니다.
ontology.context.stale=참조한 정의의 버전이 변경됐습니다. 닫고 다시 분석해 주세요.
ontology.context.helpTitle=정의 작성 단계
ontology.context.help=컬럼 정의: 선택한 샘플과 테이블·키 정보로 의미를 보강합니다. 관계·업무 정의: 저장된 RDF와 같은 스키마의 직접 연결 테이블을 참고합니다. 원본 행을 다시 조회하지 않으며 테이블의 업무 정의와 기존 FK 설명만 추천합니다. 검토 후 초안으로 저장하고 승인은 별도로 합니다. 업무 규칙은 문서나 담당자 확인이 필요합니다. 자유 서술 메타데이터에도 민감 내용이 있을 수 있으니 전송 내용을 확인하세요.
ontology.discovery.response.EMPTY=AI 관계 응답이 비어 있습니다. 저장하지 않았습니다.
ontology.discovery.response.SIZE=AI 관계 응답이 처리 한도를 넘었습니다. 원문을 표시하거나 저장하지 않았습니다.
ontology.discovery.response.JSON=AI 관계 응답이 올바른 JSON이 아닙니다. AI 응답 원문을 확인해 주세요.
ontology.discovery.response.ROOT=AI 응답에는 relations 배열만 있는 JSON 객체가 필요합니다. 저장하지 않았습니다.
ontology.discovery.response.COUNT=AI 응답의 관계가 호출당 100개 한도를 넘었습니다. 저장하지 않았습니다.
ontology.discovery.response.ITEM=필수 관계 필드(source·target·sourceColumns·targetColumns·label·reason·uncertainty)를 확인하세요. condition은 선택 사항입니다.
ontology.discovery.response.TYPE=관계 응답의 필드가 필요한 문자열 형식이 아닙니다. 원문의 표시 위치를 확인해 주세요.
ontology.discovery.response.TEXT=관계 응답에 빈 값 또는 길이·줄바꿈 위반이 있습니다. 이름 128자, 관계명 80자, 근거·확인사항 각 120자 이내의 한 줄이 필요합니다.
ontology.discovery.response.TABLE=추천 테이블·뷰가 이번 호출에 전달한 목록에 없습니다. 원문의 표시 위치를 확인해 주세요.
ontology.discovery.response.COLUMNS=출발·도착 컬럼 목록이 잘못됐습니다. 중복 없는 1~32개 컬럼을 같은 개수로 매핑해야 하며 동일 컬럼끼리의 자기 연결은 허용하지 않습니다.
ontology.discovery.response.COLUMN=추천 컬럼이 해당 테이블·뷰의 저장된 정의에 없습니다. 원문의 표시 위치를 확인해 주세요.
