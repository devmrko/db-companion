ontology.wizard.confirm=선택 컬럼의 비민감 확인과 표본 조회 동의가 필요합니다.
ontology.wizard.blocked=민감 지정·이름 규칙 또는 데이터 타입으로 제외된 컬럼입니다.
ontology.wizard.noColumns=전송 가능한 표본 컬럼이 없습니다. 민감 값 패턴이 있는 컬럼은 제외했습니다.
ontology.wizard.localOnly=이번 마법사는 로컬 일반 테이블만 지원합니다. 뷰·외부 테이블·DB Link는 제외합니다.
ontology.wizard.structureChanged=저장된 컬럼과 현재 DB 구조가 다릅니다. 메타데이터를 확인해 주세요.
ontology.wizard.echo=추천 응답에 표본 원문이나 민감 패턴이 포함되어 사용하지 않았습니다. 자동 재호출하지 않습니다.
ontology.wizard.concise=AI 답변이 문체 기준을 벗어났습니다. 설명은 80자 이내, 근거·확인사항은 각각 160자 이내의 한 줄로 작성해야 합니다. 추정 표현은 설명 대신 확인사항에 적습니다. 저장하거나 다시 호출하지 않았습니다.
ontology.wizard.failed=작업을 완료하지 못했습니다. 자동 재시도하지 않았습니다. AI 호출이 시작됐다면 사용량이 발생했을 수 있습니다. 저장 단계였다면 최신 버전을 확인해 주세요.
ontology.wizard.login=다시 로그인해 주세요.
ontology.cacheHint=목록 조회 제한은 30초입니다. 테이블 목록·코멘트는 로그인 세션에 보관하며, 이 화면의 새로고침 버튼으로 다시 읽습니다. 저장한 정의는 별도로 갱신합니다.
ontology.title=온톨로지
ontology.help=선택 스키마의 DBC_ONTOLOGY_CATALOG에 정의와 버전을 JSON으로 저장합니다. 원본 코멘트·업무 데이터는 변경하지 않습니다. 기본 AI 초안은 메타데이터만 사용하며, AI 정의 마법사는 별도 동의 후 선택 컬럼의 표본을 조회하고 전송합니다. 민감도 미확인은 안전을 뜻하지 않습니다. RDF는 저장된 정의를 표현하며 DB 그래프 생성이나 추론은 아닙니다. 버전은 앱 저장 이력이며 외부 변경 감사가 아닙니다.
