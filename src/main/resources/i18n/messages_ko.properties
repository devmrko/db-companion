ontology.limit=메타데이터 크기 한도를 초과했습니다. 내용을 잘라 저장하지 않습니다.
ontology.aiLimit=AI 입력이 64,000자를 초과했습니다. 자동 절단하지 않습니다.
ontology.aiInvalid=AI 응답 형식이나 컬럼을 확인하지 못했습니다. 저장하지 않았습니다.
