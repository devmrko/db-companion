credentials.help=선택 스키마의 Credential과 DB 권한으로 확인 가능한 사용처를 조회합니다.\n\n용도: Select AI의 LLM 호출, 벡터 임베딩, DB Link, Object Storage 적재·내보내기, 외부 API, 원격·외부 Scheduler 작업 등에 사용합니다. Cloud용과 Vector용은 인증 형식이 다를 수 있습니다.\n\n사용처는 선택 스키마의 프로필 credential_name, Tool의 credential_name/tool_params.credential_name, DB Link와 Scheduler의 명시적 참조만 확인합니다. 다른 스키마, 동적 PL/SQL, 일회성 임베딩·Object Storage 호출까지 추적하지 않습니다. 참조 0건은 미사용을 뜻하지 않습니다.\n\nCredential의 사용자·설명 정보에는 인증 JSON이 들어갈 수 있어 형식만 표시합니다. 비밀번호·토큰·키와 내부 JSON 원문은 조회하지 않습니다.\n\n목록·상세는 로그인 세션에서 재사용하며 이 화면의 새로고침 버튼으로 갱신합니다. 실제 연결 시험이나 생성·수정·삭제는 실행하지 않습니다.
