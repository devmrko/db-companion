catalogOps.linkChanged=DB Link가 변경되었습니다. 등록 내용을 다시 확인해 주세요.
catalogOps.uncertain=등록 호출 후 결과를 확정하지 못했습니다. 자동 재시도하지 않습니다. 카탈로그 목록을 새로고침해 확인해 주세요.
catalogOps.checkList=창을 닫고 카탈로그 목록을 새로고침해 확인하세요.
catalogOps.disabled=비활성 카탈로그입니다.
catalogOps.invalid=이름·선택 항목·확인 유효시간을 확인해 주세요. 카탈로그명은 영문자로 시작하는 영문·숫자·밑줄 128자 이내입니다.
