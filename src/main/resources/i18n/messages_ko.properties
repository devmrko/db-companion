dds.help=Grant · 역할 · 외부 그룹\n• 일반 Data Grant 하나를 여러 DDS 역할에 부여할 수 있고, 역할 하나도 여러 Grant를 받을 수 있습니다.\n• DDS 역할 하나의 외부 IAM 역할·그룹 매핑은 최대 1개입니다. 로컬 역할은 외부 매핑이 없습니다. DDS 역할은 일반 DB Role과 다릅니다.\n\n같은 권한을 두 그룹에 적용하는 예\n공통 Data Grant → ROLE_A ↔ 외부 그룹 A\n공통 Data Grant → ROLE_B ↔ 외부 그룹 B\nGrant의 수신자를 TO ROLE_A, ROLE_B로 지정합니다. 대상 객체·권한·조건이 같으면 Grant를 복제할 필요가 없습니다.\n※ Cross-table Grant는 TO 없이 부모 객체 권한에서 접근을 유도합니다.\n\n역할·매핑은 DB 공통, Data Grant는 선택 스키마의 대상 객체 기준입니다. 저장된 설정이며 최종 유효 권한을 계산하지 않습니다. 목록·권한 상태는 새로고침 버튼으로 갱신합니다.
