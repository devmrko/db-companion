selectAiSetup.title=Select AI 시작 안내
selectAiSetup.scope=사전 조건: DB 권한, OCI compartment·region, IAM, 네트워크와 해당 서비스의 모델 지원을 관리자와 공식 모델 목록에서 확인하세요. 모델명·기본값·리전 지원을 이 화면이 확정하지 않습니다.
selectAiSetup.resourcePrincipal=Resource Principal
selectAiSetup.resourcePrincipalText=OCI$RESOURCE_PRINCIPAL은 API key로 수동 CREATE_CREDENTIAL 하는 값이 아닙니다. tenancy 관리자가 dynamic group과 최소 IAM 정책을 만든 뒤 ADMIN이 database resource principal을 enable하고 필요 시 DB 사용자에 사용 권한을 부여합니다. 존재·조회 가능은 외부 서비스 연결 성공을 뜻하지 않습니다.
selectAiSetup.resourcePrincipalSql=-- ADMIN only; changes database configuration. Do not run from this app.\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL();\n\n-- ADMIN can enable a DB user explicitly:\nEXEC DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL(username => '<DB_USER>');\n\n-- Read-only verification, subject to dictionary privilege:\nSELECT owner, credential_name FROM dba_credentials\n WHERE credential_name = 'OCI$RESOURCE_PRINCIPAL';
selectAiSetup.apiKey=API signing key
selectAiSetup.apiKeyText=OCI IAM user의 PEM RSA key pair(SSH key와 다름)를 만들고 public key를 IAM에 등록합니다. signing-key overload에는 User OCID, Tenancy OCID, fingerprint, 암호구문 없는 private PEM을 각각 전달합니다. 앱은 private key 수집·저장·생성을 하지 않습니다.
selectAiSetup.apiKeySql=-- IAM 설정과 명시적 승인 후에만 실행합니다. Placeholder만 사용합니다.\nBEGIN\n  DBMS_CLOUD.CREATE_CREDENTIAL(\n    credential_name => '<CREDENTIAL_NAME>',\n    user_ocid       => '<USER_OCID>',\n    tenancy_ocid    => '<TENANCY_OCID>',\n    private_key     => '<PRIVATE_KEY_PEM>',\n    fingerprint     => '<FINGERPRINT>');\nEND;\n/
selectAiSetup.profile=Profile 생성·확인
selectAiSetup.profileText=provider, credential_name, model, object_list와 OCI provider에 필요한 region·compartment 범위를 문서와 서비스 콘솔에서 확인합니다. 명시 옵션과 DB 기본값은 구분해야 하며, 모르는 기본값은 정상/문제로 판정하지 않습니다. 생성, 세션 활성화, SHOWSQL, 선택적 read-only 실행은 별도 단계입니다.
selectAiSetup.profileSql=-- 1. CREATE_PROFILE은 DB 설정을 생성합니다. 이 앱에서 실행하지 마세요.\nBEGIN DBMS_CLOUD_AI.CREATE_PROFILE(\n  profile_name => '<PROFILE_NAME>',\n  attributes => '{"provider":"oci","credential_name":"<CREDENTIAL_NAME>","model":"<MODEL>","object_list":[{"owner":"<SCHEMA>","name":"<TABLE>"}]}'); END;\n/\n-- 2. SET_PROFILE은 현재 stateful session에만 영향을 줍니다.\nEXEC DBMS_CLOUD_AI.SET_PROFILE('<PROFILE_NAME>');\n-- 3. SHOWSQL은 외부 AI 요청/비용이 발생할 수 있으며 SQL 정답을 보장하지 않습니다.\nSELECT AI SHOWSQL '<QUESTION>';\n-- Read-only catalog check:\nSELECT attribute_name, attribute_value FROM user_cloud_ai_profile_attributes WHERE profile_name = '<PROFILE_NAME>' ORDER BY attribute_name;
selectAiSetup.limits=인증·권한·모델·허용 객체 오류는 원문 ORA 코드와 실패 단계를 함께 확인하세요. ORA-00942는 객체 부재 또는 권한 부족일 수 있고, 성공한 AI 생성도 정답을 보장하지 않습니다. 이 안내는 OCI 정책·키·Credential·Profile을 변경하거나 과금 호출을 수행하지 않습니다.
