archive.sourceAccess=V$SQL 조회 상태
archive.loading=조회 중…
archive.applying=적용 중… 자동 재시도하지 않습니다.
archive.applied=요청을 반영했습니다. 수집 완료 여부는 새로고침하여 최근 실행 결과로 확인하세요.
archive.empty=조건에 맞는 저장 SQL이 없습니다.
