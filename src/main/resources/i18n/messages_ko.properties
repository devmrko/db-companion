ontology.notFound=테이블 또는 저장된 정의를 찾지 못했습니다.
ontology.stale=버전·선택 정보가 바뀌었거나 요청이 만료되었습니다. 최신 버전을 다시 열어 주세요.
ontology.verifyFailed=저장값 대조가 일치하지 않아 트랜잭션을 중단했습니다.
ontology.confirmRequired=생성 확인이 필요합니다.
ontology.chooseProfile=AI 도우미 설정에서 프로필을 먼저 선택해 주세요.
ontology.loadError=온톨로지 조회 오류
ontology.installError=생성 결과를 확인해야 합니다. DDL은 남아 있을 수 있으므로 새로고침해 주세요. 자동 재시도하지 않았습니다.
ontology.saveError=저장 결과를 확인해야 합니다. 입력을 보관하고 최신 버전을 다시 조회해 주세요. 자동 재시도하지 않았습니다.
ontology.aiError=AI 결과를 확인하지 못했습니다. 사용량이 발생했을 수 있으며 자동 재시도하지 않았습니다.
