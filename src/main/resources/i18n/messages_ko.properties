aitest.uncertain=결과가 불확실합니다. 새로고침으로 상태를 확인하세요. 자동 재시도하지 않았습니다.
aitest.execute=SQL 실행
aitest.executing=조회 중…
aitest.executeHelp=로그인 계정 권한으로 SQL을 Oracle에 전달합니다. 앱은 SQL 구문·함수·객체 허용 목록을 적용하지 않습니다. 읽기 전용 트랜잭션·최대 200행·실행 제한 120초를 유지합니다. 함수의 별도 트랜잭션이나 외부 호출까지 차단하는 기능은 아니므로 원문을 확인하세요. 결과는 외부 AI에 보내지 않습니다.
aitest.executeConsent=위 SQL을 검토했으며 DB 조회를 실행합니다.
aitest.executeStale=실행 요청이 만료되거나 변경됐습니다. SQL 실행 확인창을 다시 열어 주세요.
aitest.executeError=조회 결과를 확인하지 못했습니다. 자동 재시도하지 않았습니다.
aitest.sqlBlocked=조회할 SELECT/WITH SQL 응답이 필요합니다. 빈 응답·명령·입력 한도(20,000자) 초과는 실행하지 않습니다.
aitest.rowCount={0}행 · {1}초
