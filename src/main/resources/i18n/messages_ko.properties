ontology.values.optionalHelp=특정 값에 별도 업무 용어를 연결할 때만 사용합니다. 모든 값을 등록할 필요는 없습니다. 컬럼 전체의 의미는 ‘컬럼 정의 마법사’에서 작성합니다.
ontology.values.help=업무 용어를 실제 컬럼·코드값에 연결합니다. 코드값·대표명·유사표현은 선택 스키마의 DBC_ONTOLOGY_CATALOG.PAYLOAD에 버전별 JSON으로 저장됩니다. 초안 저장은 보관만 하며, 승인 저장은 이 문서 전체를 승인합니다. 승인된 매핑만 질문 근거에 사용합니다. 코드 조회는 로컬 일반 테이블의 최대 20행이며 전체 코드나 유일성을 보장하지 않습니다. 민감·과도하게 긴 값은 제외합니다. 조회만으로 저장·AI 호출은 하지 않습니다.
