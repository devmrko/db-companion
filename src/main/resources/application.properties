spring.application.name=db-manage-companion
spring.config.import=optional:file:./.env[.properties]
app.oracle.wallet-path=${ORACLE_WALLET_PATH:}
app.oracle.wallet-paths=${ORACLE_WALLET_PATHS:}
app.ords.test-endpoints=${ORDS_TEST_ENDPOINTS:}
app.select-ai.sql-timeout-seconds=${SELECT_AI_SQL_TIMEOUT_SECONDS:300}
app.select-ai.generate-timeout-seconds=${SELECT_AI_GENERATE_TIMEOUT_SECONDS:300}
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.timeout=15m
server.servlet.session.persistent=false
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=5MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
# Pool/driver messages can include connection details. Application logs contain error codes only.
logging.level.com.zaxxer.hikari=OFF
logging.level.oracle=OFF
