<!DOCTYPE html><html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head(#{menu.item.scenario-data})}"></head>
<body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header><main class="app-content" data-scenario>
<th:block th:replace="~{fragments/common :: pageTitle('scenario-data')}"></th:block>
<p th:text="#{scenario.help}"></p><p class="app-alert" th:if="${configurationError}" th:text="${configurationError}"></p>
<input type="hidden" data-scenario-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
<form class="app-card app-module-card" data-scenario-form>
  <h2 th:text="#{scenario.inputs}"></h2>
  <div class="row g-3">
    <label class="col-md-6"><span th:text="#{scenario.wallet}"></span><select class="form-select" name="walletId" required><option th:each="wallet : ${walletOptions}" th:value="${wallet.id}" th:text="${wallet.name}"></option></select></label>
    <label class="col-md-6"><span th:text="#{scenario.alias}"></span><select class="form-select" name="tnsAlias" required disabled></select></label>
    <label class="col-md-6"><span th:text="#{scenario.preset}"></span><select class="form-select" name="preset" required><option th:each="preset : ${presets}" th:value="${preset}" th:text="${#messages.msg('scenario.preset.' + preset)}"></option></select></label>
    <label class="col-md-6"><span th:text="#{scenario.rows}"></span><input class="form-control" type="number" name="rows" min="1" max="10000000" step="1" value="10000" required></label>
    <label class="col-12"><span th:text="#{scenario.description}"></span><input class="form-control" name="description" maxlength="2000" autocomplete="off"><small th:text="#{scenario.noSecrets}"></small></label>
    <label class="col-md-6"><span th:text="#{scenario.start}"></span><input class="form-control" type="date" name="startDate" min="1900-01-01" max="2100-12-31" required></label>
    <label class="col-md-6"><span th:text="#{scenario.end}"></span><input class="form-control" type="date" name="endDate" min="1900-01-01" max="2100-12-31" required></label>
    <label class="col-md-6"><span th:text="#{scenario.username}"></span><input class="form-control" name="username" pattern="[A-Za-z][A-Za-z0-9_]{0,29}" maxlength="30" required autocomplete="off"></label>
    <label class="col-md-6"><span th:text="#{scenario.prefix}"></span><input class="form-control" name="prefix" pattern="[A-Za-z][A-Za-z0-9_]{0,14}_" maxlength="16" value="DEMO_" required><small th:text="#{scenario.prefixHelp}"></small></label>
  </div>
  <div class="app-actions"><button class="btn app-btn app-btn-primary" type="submit" data-scenario-generate disabled th:text="#{scenario.generate}"></button></div>
</form>
<p role="status" aria-live="polite" data-scenario-status></p>
<section class="app-card app-module-card" data-scenario-output hidden>
  <h2 th:text="#{scenario.output}"></h2><p th:text="#{scenario.run}"></p>
  <details open><summary>scenario-config.json</summary><pre class="app-preview-source" data-scenario-config></pre><button class="btn app-btn app-btn-secondary" type="button" data-copy="config" th:text="#{scenario.copy}"></button> <button class="btn app-btn app-btn-secondary" type="button" data-download="config" th:text="#{scenario.download}"></button></details>
  <details><summary>scenario-prompt.md</summary><pre class="app-preview-source" data-scenario-prompt></pre><button class="btn app-btn app-btn-secondary" type="button" data-copy="prompt" th:text="#{scenario.copy}"></button> <button class="btn app-btn app-btn-secondary" type="button" data-download="prompt" th:text="#{scenario.download}"></button></details>
</section>
<details class="app-card app-module-card"><summary th:text="#{scenario.admin}"></summary><p th:text="#{scenario.adminHelp}"></p><pre class="app-preview-source">-- Administrator review only; replace SCENARIO_USER and USERS.
GRANT CREATE SESSION, CREATE TABLE, CREATE VIEW, CREATE SEQUENCE TO SCENARIO_USER;
ALTER USER SCENARIO_USER QUOTA 100M ON USERS;</pre><p th:text="#{scenario.adminReason}"></p></details>
</main></div><script type="module" th:src="@{/js/scenario-data.mjs}"></script></body></html>
