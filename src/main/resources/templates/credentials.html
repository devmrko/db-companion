<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Credential')}"></head>
<body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside>
<div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header>
<main class="app-content">
  <div class="app-page-heading"><h1>Credential</h1><button th:replace="~{fragments/common :: sqlHelp('credentials', 'list')}"></button><details class="app-dds-help"><summary aria-label="Credential ?">?</summary><div th:text="#{credentials.help}"></div></details></div>
  <th:block th:replace="~{fragments/select-ai-setup :: guide}"></th:block>
  <p class="app-alert is-error" th:if="${schemaError}" th:text="${schemaError}"></p>
  <section data-credentials th:attr="data-schema=${selectedSchema},data-base=@{/db/credentials}">
    <div class="app-card">
      <div class="app-dds-toolbar">
        <strong th:text="${selectedSchema}"></strong>
        <label class="visually-hidden" for="credential-filter" th:text="#{credentials.filter}"></label>
        <input class="form-control" id="credential-filter" type="search" data-credentials-filter th:placeholder="#{credentials.filter}">
        <button class="btn app-btn app-btn-quiet app-icon-button" type="button" data-credentials-refresh th:title="#{ui.8259f9d35351}" th:aria-label="#{ui.8259f9d35351}"><svg th:replace="~{fragments/common :: icon('refresh')}"></svg></button>
      </div>
      <p class="app-dds-status" role="status" data-credentials-message></p>
      <div class="table-responsive" data-credentials-list></div>
      <div class="app-dds-pages"><span data-credentials-count></span><div><button type="button" class="btn app-btn app-btn-quiet" data-credentials-prev disabled th:text="#{ui.da7e61c67cc5}">이전</button><span data-credentials-page></span><button type="button" class="btn app-btn app-btn-quiet" data-credentials-next disabled th:text="#{ui.aef613c6612d}">다음</button></div></div>
    </div>
    <section class="app-card app-dds-detail" data-credentials-detail aria-live="polite" hidden></section>
  </section>
</main></div><script type="module" th:src="@{/js/credentials.mjs}"></script></body></html>
