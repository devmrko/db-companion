<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{resultArchive.title})}"></head>
<body class="app-shell">
<aside th:replace="~{fragments/common :: sidebar}"></aside>
<div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header>
<main class="app-content" data-result-archive>
  <div class="app-page-heading"><h1 th:text="#{resultArchive.title}">보관한 조회 결과</h1></div>
  <nav th:replace="~{fragments/execution-tabs :: tabs('results')}"></nav>
  <section class="app-card">
    <div class="app-card-heading"><h2 th:text="#{resultArchive.title}">보관한 조회 결과</h2></div>
    <div class="app-preview-body">
      <p class="app-filter-message" th:text="#{resultArchive.help}">DB Companion에서 결과 보관을 선택한 조회입니다. 질문·SQL·당시 표시한 결과를 다시 봅니다. 저장 전에 실행한 결과는 복원되지 않습니다.</p>
      <form class="app-table-toolbar app-execution-filters" data-ra-filters>
        <div><label for="ra-from" th:text="#{ui.8f27ff351722}">시작일 (한국 시간)</label><input class="form-control app-input" type="date" id="ra-from" name="from"></div>
        <div><label for="ra-to" th:text="#{ui.9e586213e334}">종료일</label><input class="form-control app-input" type="date" id="ra-to" name="to"></div>
        <div><label for="ra-profile" th:text="#{ui.c55831fbc2ba}">프로필명</label><input class="form-control app-input" type="search" id="ra-profile" name="profile" maxlength="128"></div>
        <div><label for="ra-question" th:text="#{ui.32729cc3f7b6}">질문</label><input class="form-control app-input" type="search" id="ra-question" name="question" maxlength="500"></div>
        <button class="btn app-btn app-btn-secondary" type="submit" th:text="#{ui.4b8d541ebe6d}">검색</button>
      </form>
      <p role="status" data-ra-message></p>
      <div class="table-responsive"><table class="table app-table app-summary-table app-execution-table">
        <thead><tr><th th:text="#{resultArchive.executedAt}">실행일시</th><th th:text="#{ui.4a7849864c3b}">프로필</th><th th:text="#{resultArchive.rowCount}">보관 행 수</th><th th:text="#{ui.32729cc3f7b6}">질문</th></tr></thead>
        <tbody data-ra-list></tbody>
      </table></div>
      <div class="app-pagination"><button type="button" class="btn app-btn app-btn-secondary" data-ra-previous disabled th:text="#{ui.da7e61c67cc5}">이전</button><span data-ra-page></span><button type="button" class="btn app-btn app-btn-secondary" data-ra-next disabled th:text="#{ui.aef613c6612d}">다음</button></div>
    </div>
  </section>
  <dialog class="app-preview-dialog app-execution-dialog" data-ra-dialog aria-labelledby="ra-detail-title">
    <header class="app-preview-header"><h2 id="ra-detail-title" th:text="#{resultArchive.detail}">보관한 조회 결과 상세</h2><button type="button" class="btn app-btn app-btn-quiet" data-ra-close th:text="#{ui.1e8c10206f5b}">닫기</button></header>
    <div class="app-preview-body"><p role="status" data-ra-detail-message></p><div data-ra-detail></div></div>
  </dialog>
</main></div><script type="module" th:src="@{/js/select-ai-result-archive.mjs}"></script>
</body></html>
