<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<nav th:fragment="sources(current)" class="app-tabs" th:aria-label="#{sqlh.sources}">
  <a th:if="${sqlCapabilities != null && sqlCapabilities['mapping'].available}" th:href="@{/ai-executions/sql}" th:classappend="${current == 'mapping'} ? 'is-active'" th:attr="aria-current=${current == 'mapping' ? 'page' : null}" th:text="#{sqlh.mapping}">SQL 매핑</a>
  <th:block th:each="name : ${ {'cache','awr','audit'} }"><a th:if="${sqlCapabilities != null && sqlCapabilities.get(name).available}" th:href="@{/ai-executions/sql/sources(source=${name})}" th:classappend="${current == name} ? 'is-active'" th:attr="aria-current=${current == name ? 'page' : null}" th:text="${#messages.msg('sqlh.' + name)}"></a></th:block>
  <a th:href="@{/ai-executions/sql/archive}" th:classappend="${current == 'archive'} ? 'is-active'" th:attr="aria-current=${current == 'archive' ? 'page' : null}" th:text="#{sqlh.archive}">저장된 SQL</a>
</nav>
<section th:fragment="access" th:if="${sqlCapabilities != null}">
  <p th:if="${sqlSourceBlocked == true}" role="status" class="app-muted" th:text="#{sqlh.capability.blocked}"></p>
  <details class="app-agent-details"><summary th:text="#{sqlh.capability.title}"></summary>
    <p class="app-muted" th:text="#{sqlh.capability.note}"></p>
    <dl class="app-detail-list"><div th:each="name : ${ {'mapping','cache','awr','audit','policies'} }">
      <dt th:text="${#messages.msg('sqlh.' + name)}"></dt>
      <dd th:attr="data-source=${name},data-capability=${sqlCapabilities.get(name).state}" th:text="${#messages.msg('sqlh.capability.' + sqlCapabilities.get(name).state)}"></dd>
    </div></dl>
  </details>
</section>
</body></html>
