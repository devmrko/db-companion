<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="dialog">
<dialog class="app-preview-dialog" data-feedback-editor th:attr="data-schema=${selectedSchema},data-profile=${profile},data-url=@{/ai-feedback/edit},data-install=@{/ai-create/install}" aria-labelledby="feedback-editor-title">
<header class="app-preview-header"><h2 id="feedback-editor-title" th:text="#{feedbackEdit.title}">Feedback 등록·편집</h2><button type="button" class="btn app-btn app-btn-quiet" data-fe-close th:text="#{ui.1e8c10206f5b}">닫기</button></header>
<form class="app-editor-form" data-fe-form><input type="hidden" th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}" data-fe-csrf>
<p class="app-muted" th:text="${selectedSchema + '.' + profile}"></p><p data-fe-message role="status" aria-live="polite"></p>
<details><summary th:text="#{creation.helpTitle}">도움말</summary><p th:text="#{feedbackEdit.help}"></p></details>
<button type="button" class="btn app-btn app-btn-secondary" data-fe-install hidden th:text="#{creation.install}">공통 이력 준비</button>
<fieldset data-fe-fields disabled>
<label class="app-creation-field"><span th:text="#{ui.b3cee53ed773}">Select AI 원문</span><textarea class="form-control" rows="3" data-fe-sql required spellcheck="false"></textarea></label>
<label class="app-creation-field"><span th:text="#{ui.53818ff46ad2}">응답 SQL</span><textarea class="form-control app-editor-value" rows="9" data-fe-response required spellcheck="false"></textarea></label>
<label class="app-creation-field"><span th:text="#{ui.fb26bb95e447}">Feedback 설명</span><textarea class="form-control" rows="3" data-fe-feedback></textarea></label>
<label class="app-creation-field"><input type="checkbox" data-fe-consent> <span th:text="#{creation.costConsent}"></span></label>
<label class="app-creation-field"><input type="checkbox" data-fe-confirm> <span th:text="#{feedbackEdit.confirm}"></span></label>
<button type="submit" class="btn app-btn app-btn-primary" data-fe-save disabled th:text="#{ui.5fb926229090}">저장</button>
</fieldset><a data-fe-result hidden class="app-back-link" th:href="@{/ai-feedback(schema=${selectedSchema},profile=${profile})}" th:text="#{creation.openResult}">결과 확인</a>
</form></dialog><script type="module" th:src="@{/js/feedback-editor.mjs}"></script></th:block></body></html>
