<header th:fragment="topbar" class="app-topbar" th:attr="data-admin-account=${info != null ? info.username : ''}">
  <div class="app-breadcrumb">
    <button class="btn app-btn app-btn-quiet app-icon-button" type="button" data-sidebar-toggle aria-controls="app-sidebar" aria-expanded="true" th:aria-label="#{ui.9f6ec12024c7}" th:title="#{ui.9f6ec12024c7}"><svg th:replace="~{fragments/common :: icon('sidebar')}"></svg></button>
    <strong th:if="${info != null}" th:text="${info.username}"></strong>
  </div>
  <div class="app-topbar-actions">
    <a th:if="${info != null}" class="btn app-btn app-btn-quiet" th:href="@{/db/admin-help}" th:text="#{adminHelp.title}"></a>
    <form th:replace="~{fragments/common :: language}"></form>
    <form th:if="${schemas != null}" th:action="@{/schema}" method="post" class="app-schema-form" data-schema-form>
      <label for="schema" th:text="#{ui.3f863f643fcc}">스키마</label>
      <select class="form-select app-select app-schema-select" name="schema" id="schema" data-schema-select>
        <option th:each="schema : ${schemas}" th:value="${schema}" th:text="${schema}" th:selected="${schema == selectedSchema}"></option>
      </select>
      <input type="hidden" name="returnTo" th:value="${activePage == 'ords' ? '/db/ords' : activePage == 'vpd' ? '/db/vpd' : activePage == 'ontology-query' ? '/ontology-query' : activePage == 'ontology' ? '/ontology' : (activePage == 'scheduler' ? '/db/scheduler' : (activePage == 'external' ? '/db/external-sources' : (activePage == 'assistant' ? '/ai-assistant' : (activePage == 'credentials' ? '/db/credentials' : (activePage == 'security' ? '/db/security' : (activePage == 'functions' ? '/db/functions' : (activePage == 'vectors' ? '/vector-search' : (activePage == 'feedback' ? '/ai-feedback' : (activePage == 'executions' ? (executionReturn ?: '/ai-executions') : (activePage == 'agents' ? '/ai-agents' : (activePage == 'profiles' ? '/ai-profiles' : (activePage == 'tables' ? '/tables' : '/'))))))))))))}">
      <noscript><button class="btn app-btn app-btn-secondary" type="submit" th:text="#{ui.6a1c963d5bc5}">적용</button></noscript>
    </form>
    <form th:if="${schemas != null}" th:action="@{/schema/refresh}" method="post">
      <input type="hidden" name="returnTo" th:value="${activePage == 'ords' ? '/db/ords' : activePage == 'vpd' ? '/db/vpd' : activePage == 'ontology-query' ? '/ontology-query' : activePage == 'ontology' ? '/ontology' : (activePage == 'scheduler' ? '/db/scheduler' : (activePage == 'external' ? '/db/external-sources' : (activePage == 'assistant' ? '/ai-assistant' : (activePage == 'credentials' ? '/db/credentials' : (activePage == 'security' ? '/db/security' : (activePage == 'functions' ? '/db/functions' : (activePage == 'vectors' ? '/vector-search' : (activePage == 'feedback' ? '/ai-feedback' : (activePage == 'executions' ? (executionReturn ?: '/ai-executions') : (activePage == 'agents' ? '/ai-agents' : (activePage == 'profiles' ? '/ai-profiles' : (activePage == 'tables' ? '/tables' : '/'))))))))))))}">
      <button class="btn app-btn app-btn-quiet app-icon-button" type="submit" th:title="#{ui.9f919575a4d0}" th:aria-label="#{ui.9f919575a4d0}"><svg th:replace="~{fragments/common :: icon('refresh')}"></svg></button>
    </form>
    <form th:action="@{/logout}" method="post"><button class="btn app-btn app-btn-quiet" type="submit"><svg th:replace="~{fragments/common :: icon('logout')}"></svg><th:block th:text="#{ui.919c1b323225}">로그아웃</th:block></button></form>
  </div>
  <dialog class="app-preview-dialog app-sql-help-dialog" data-sql-help-dialog aria-labelledby="sql-help-title">
    <div class="app-preview-header">
      <h2 id="sql-help-title" data-sql-help-label="title" th:text="#{sqlHelp.title}">SQL / PLSQL 도움말</h2>
      <button type="button" class="btn app-btn app-btn-secondary" data-sql-help-close data-sql-help-label="close" th:text="#{sqlHelp.close}">닫기</button>
    </div>
    <div class="app-preview-body">
      <div class="app-sql-help-picker">
        <label for="sql-help-operation" data-sql-help-label="operation">작업 선택</label>
        <select id="sql-help-operation" class="form-select app-select" data-sql-help-operation></select>
        <span class="app-sql-help-risk" data-sql-help-risk></span>
        <p class="app-muted" data-sql-help-fallback hidden></p>
      </div>
      <section class="app-sql-help-section"><h3 data-sql-help-label="purpose" th:text="#{sqlHelp.purpose}">목적</h3><p data-sql-help-purpose></p></section>
      <section class="app-sql-help-section">
        <h3 data-sql-help-label="sql" th:text="#{sqlHelp.sql}">SQL·PLSQL</h3>
        <pre class="app-preview-source" data-sql-help-sql tabindex="0"></pre>
        <div class="app-sql-help-actions">
          <button type="button" class="btn app-btn app-btn-secondary" data-sql-help-copy data-sql-help-label="copy" th:text="#{sqlHelp.copy}">SQL 복사</button>
          <p class="app-filter-message" data-sql-help-status aria-live="polite"></p>
        </div>
      </section>
      <section class="app-sql-help-section"><h3 data-sql-help-label="variables" th:text="#{sqlHelp.variables}">변수</h3><p data-sql-help-variables></p></section>
      <section class="app-sql-help-section"><h3 data-sql-help-label="permission" th:text="#{sqlHelp.permission}">권한·실행 주체</h3><p data-sql-help-permission></p></section>
      <section class="app-sql-help-section"><h3 data-sql-help-label="effects" th:text="#{sqlHelp.effects}">읽기·쓰기·외부 호출·비용</h3><p data-sql-help-effects></p></section>
      <section class="app-sql-help-section"><h3 data-sql-help-label="result" th:text="#{sqlHelp.result}">결과 확인</h3><p data-sql-help-result></p>
        <div data-sql-help-verification hidden>
          <h4 data-sql-help-label="verify">확인용 조회 SQL</h4>
          <pre class="app-preview-source" data-sql-help-verify tabindex="0"></pre>
          <button type="button" class="btn app-btn app-btn-secondary" data-sql-help-copy-verify data-sql-help-label="copyVerify">확인 SQL 복사</button>
        </div>
      </section>
      <p class="app-sql-help-origin"><span data-sql-help-label="source">소스 근거</span>: <code data-sql-help-source></code></p>
      <a class="app-sql-help-doc" data-sql-help-doc target="_blank" rel="noopener noreferrer" data-sql-help-label="doc" th:text="#{sqlHelp.doc}">Oracle 공식 문서</a>
    </div>
  </dialog>
</header>
<form th:fragment="language" th:action="@{/language}" method="post" class="app-language-form" data-language-form>
  <input type="hidden" name="returnTo" th:value="${languageReturn ?: '/login'}" data-language-return>
  <select name="language" class="form-select app-select app-language-select" th:aria-label="#{language.label}" data-language-select>
    <option value="ko" th:selected="${#locale.language == 'ko'}">한국어</option>
    <option value="en" th:selected="${#locale.language == 'en'}">English</option>
    <option value="zh-CN" th:selected="${#locale.language == 'zh'}">简体中文</option>
    <option value="ja" th:selected="${#locale.language == 'ja'}">日本語</option>
  </select>
