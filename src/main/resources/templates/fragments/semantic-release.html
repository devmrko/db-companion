<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="panel" class="app-card app-module-card" data-semantic-release th:attr="data-base=@{/semantic-releases}">
  <input type="hidden" data-sr-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
  <h2 th:text="#{semantic.title}">시멘틱 배포 버전</h2>
  <p class="app-filter-message" th:text="#{semantic.help}"></p>
  <p role="status" data-sr-message></p>
  <button type="button" class="btn app-btn app-btn-primary" data-sr-initialize hidden th:text="#{semantic.initialize}"></button>
  <label for="semantic-selection" th:text="#{semantic.selection}"></label>
  <div class="app-editor-actions"><select id="semantic-selection" class="form-select app-select" data-sr-selection disabled></select><button type="button" class="btn app-btn app-btn-primary" data-sr-select disabled th:text="#{semantic.apply}"></button></div>
  <p class="app-filter-message" data-sr-current></p>
  <details class="app-disclosure"><summary th:text="#{semantic.manage}"></summary>
    <p th:text="#{semantic.snapshotHelp}"></p>
    <div class="app-field app-section"><label for="semantic-name" th:text="#{semantic.name}"></label><input id="semantic-name" class="form-control" maxlength="120" data-sr-name></div>
    <button type="button" class="btn app-btn app-btn-secondary" data-sr-create disabled th:text="#{semantic.create}"></button>
    <details class="app-disclosure">
      <summary th:text="#{semantic.edit}"></summary>
      <p class="app-filter-message" th:text="#{semantic.editHelp}"></p>
      <label for="semantic-parent" th:text="#{semantic.parent}"></label>
      <div class="app-editor-actions"><select id="semantic-parent" class="form-select app-select" data-sr-parent></select><button type="button" class="btn app-btn app-btn-secondary" data-sr-load th:text="#{semantic.load}"></button></div>
      <div class="app-scroll-region" data-sr-members></div>
      <button type="button" class="btn app-btn app-btn-primary" data-sr-revise disabled th:text="#{semantic.revise}"></button>
    </details>
    <div class="app-creation-grid">
      <div class="app-field"><label for="semantic-target" th:text="#{semantic.target}"></label><select id="semantic-target" class="form-select app-select" data-sr-target disabled></select></div>
      <div class="app-field"><label for="semantic-reason" th:text="#{semantic.reason}"></label><input id="semantic-reason" class="form-control" maxlength="500" data-sr-reason></div>
    </div>
    <button type="button" class="btn app-btn app-btn-secondary" data-sr-deploy disabled th:text="#{semantic.deploy}"></button>
    <details><summary th:text="#{semantic.contents}"></summary><div data-sr-contents></div></details>
    <h3 th:text="#{semantic.history}"></h3><div data-sr-history></div>
  </details>
  <script type="module" th:src="@{/js/semantic-release.mjs}"></script>
</section></body></html>
