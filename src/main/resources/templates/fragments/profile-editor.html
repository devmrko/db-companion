<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="editor">
  <dialog class="app-preview-dialog" aria-labelledby="profile-editor-title" data-profile-editor
          th:attr="data-schema=${selectedSchema},data-profile=${profileName},data-url=@{/ai-profiles/attribute}">
    <header class="app-preview-header"><h2 id="profile-editor-title" th:text="#{ui.c25511233daf}">프로필 속성 편집</h2><button th:replace="~{fragments/common :: sqlHelp('profiles', 'options')}"></button><button type="button" class="btn app-btn app-btn-quiet" data-pe-close th:text="#{ui.1e8c10206f5b}">닫기</button></header>
    <form class="app-editor-form" data-pe-form>
      <input type="hidden" th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}" data-pe-csrf>
      <p class="app-muted" data-pe-object></p>
      <p class="app-alert" role="status" aria-live="polite" data-pe-message hidden></p>
      <fieldset data-pe-fields disabled>
        <div class="app-profile-field-label"><label for="profile-attribute-value" data-pe-label th:text="#{ui.b19ddf94b4c9}">값</label><span data-pe-help></span></div>
        <div data-pe-control></div>
        <div data-pe-raw><textarea class="form-control app-editor-value app-profile-editor-value" id="profile-attribute-value" rows="14" spellcheck="false" data-pe-value></textarea></div>
        <p class="app-muted app-editor-note" data-pe-counter><span data-pe-bytes>0</span> <th:block th:text="#{ui.a86e5c687c71}">/ 32,767바이트 (UTF-8)</th:block></p>
        <p class="app-muted app-editor-note" data-pe-hint></p>
        <div class="app-editor-actions"><button class="btn app-btn app-btn-primary" type="submit" data-pe-save disabled th:text="#{ui.5fb926229090}">저장</button></div>
      </fieldset>
    </form>
  </dialog>
  <script type="module" th:src="@{/js/profile-editor.mjs}"></script>
</th:block>
</body></html>
