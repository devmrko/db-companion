<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="settings" class="app-question-analysis" data-question-analysis id="question-analysis-settings" aria-label="Question analysis">
  <div class="app-question-analysis-toolbar">
    <label><span th:text="#{questionAnalysis.language}">질문 분석 언어</span><select class="form-select app-select" data-analysis-language>
      <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option>
    </select></label>
    <button type="button" class="btn app-btn app-btn-quiet" data-analysis-refresh th:text="#{questionAnalysis.refresh}">설정 상태 확인</button>
  </div>
  <p class="app-filter-message" th:text="#{questionAnalysis.languageHelp}"></p>
  <p role="status" aria-live="polite" data-analysis-status></p>
  <details data-analysis-setup hidden><summary th:text="#{questionAnalysis.setupHelp}"></summary>
    <p class="app-filter-message" th:text="#{questionAnalysis.setupNotice}"></p>
    <pre class="app-preview-source app-query-code" data-analysis-sql tabindex="0"></pre>
    <button type="button" class="btn app-btn app-btn-quiet" data-analysis-copy th:text="#{questionAnalysis.copy}"></button>
  </details>
</section>
</body></html>
