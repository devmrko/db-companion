<!DOCTYPE html><html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{demoData.title})}"></head>
<body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header>
<main class="app-content" data-demo-data>
  <div class="app-page-heading"><h1 th:text="#{demoData.title}"></h1></div>
  <p th:text="#{demoData.help}"></p>
  <p><strong th:text="${info.database}"></strong> · <strong th:text="${info.username}"></strong></p>
  <p class="app-alert" th:text="#{demoData.ownerRequired}"></p>
  <p class="app-alert" th:if="${configurationError}" th:text="${configurationError}"></p>
  <input type="hidden" data-demo-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
  <section class="app-card app-section" data-demo-input>
    <h2 th:text="#{demoData.step1}"></h2>
    <form data-demo-form class="app-form">
      <label for="demo-wallet" th:text="#{demoData.export.wallet}"></label><select id="demo-wallet" name="walletId" class="form-select" required><option th:each="wallet : ${walletOptions}" th:value="${wallet.id}" th:text="${wallet.name}"></option></select>
      <label for="demo-alias" th:text="#{demoData.export.alias}"></label><select id="demo-alias" name="tnsAlias" class="form-select" required disabled></select>
      <label for="demo-preset" th:text="#{demoData.export.preset}"></label><select id="demo-preset" name="preset" class="form-select" required><option th:each="preset : ${presets}" th:value="${preset}" th:text="${#messages.msg('demoData.export.preset.' + preset)}"></option></select>
      <p th:text="#{demoData.export.noSecrets}"></p>
      <label for="demo-scenario" th:text="#{demoData.scenario}"></label><textarea id="demo-scenario" name="scenario" class="form-control" maxlength="2000" rows="3" required></textarea>
      <label for="demo-questions" th:text="#{demoData.questions}"></label><textarea id="demo-questions" name="questions" class="form-control" maxlength="4000" rows="4" required></textarea>
      <label for="demo-rules" th:text="#{demoData.rules}"></label><textarea id="demo-rules" name="rules" class="form-control" maxlength="4000" rows="4" required></textarea>
      <label for="demo-date" th:text="#{demoData.export.start}"></label><input id="demo-date" name="date" min="1900-01-01" max="2100-12-31" type="date" class="form-control" required>
      <label for="demo-end" th:text="#{demoData.export.end}"></label><input id="demo-end" name="endDate" type="date" min="1900-01-01" max="2100-12-31" class="form-control" required>
      <label for="demo-prefix" th:text="#{demoData.export.prefix}"></label><input id="demo-prefix" name="prefix" class="form-control" pattern="[A-Za-z][A-Za-z0-9_]{0,14}_" maxlength="16" value="DEMO_" required><small th:text="#{demoData.export.prefixHelp}"></small>
      <label for="demo-rows" th:text="#{demoData.rows}"></label><input id="demo-rows" name="rows" type="number" class="form-control" min="1" max="10000" value="120" required>
      <button type="submit" class="btn app-btn app-btn-primary" data-demo-build disabled th:text="#{demoData.build}"></button>
    </form>
  </section>
  <section class="app-card app-section" data-demo-review hidden>
    <h2 th:text="#{demoData.step2}"></h2><p th:text="#{demoData.review}"></p>
    <p th:text="#{demoData.export.run}"></p>
    <details open><summary>scenario-config.json</summary><pre class="app-preview-source" data-demo-config></pre><button type="button" class="btn app-btn app-btn-secondary" data-copy="config" th:text="#{demoData.export.copy}"></button> <button type="button" class="btn app-btn app-btn-secondary" data-download="config" th:text="#{demoData.export.download}"></button></details>
    <details><summary>scenario-prompt.md</summary><pre class="app-preview-source" data-demo-prompt></pre><button type="button" class="btn app-btn app-btn-secondary" data-download="prompt" th:text="#{demoData.export.download}"></button></details>
    <div class="app-actions"><button type="button" class="btn app-btn app-btn-primary" data-copy="prompt" th:text="#{demoData.copy}"></button><button type="button" class="btn app-btn app-btn-quiet" data-demo-back th:text="#{demoData.back}"></button></div>
    <details><summary th:text="#{demoData.step3}"></summary><p th:text="#{demoData.verify}"></p><a th:href="@{/tables}" th:text="#{dashboard.ready.metadata}"></a> · <a th:href="@{/business-glossary}" th:text="#{businessGlossary.title}"></a></details>
  </section>
  <details class="app-card app-section"><summary th:text="#{demoData.export.admin}"></summary><p th:text="#{demoData.export.adminHelp}"></p><pre class="app-preview-source">-- Administrator review only; replace SCENARIO_USER and USERS.
GRANT CREATE SESSION, CREATE TABLE, CREATE VIEW, CREATE SEQUENCE TO SCENARIO_USER;
ALTER USER SCENARIO_USER QUOTA 100M ON USERS;</pre><p th:text="#{demoData.export.adminReason}"></p></details>
  <p role="status" aria-live="polite" data-demo-message></p>
</main></div><script type="module" th:src="@{/js/demo-data.mjs}"></script></body></html>
