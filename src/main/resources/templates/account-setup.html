<!DOCTYPE html><html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{accountSetup.title})}"></head>
<body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header>
<main class="app-content"><h1 th:text="#{accountSetup.title}"></h1><p th:text="#{accountSetup.help}"></p>
<p class="app-alert" th:unless="${accountAdmin}" th:text="#{accountSetup.admin}"></p>
<section th:if="${accountAdmin}" class="app-card" data-account-setup>
  <input type="hidden" data-as-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
  <p><strong th:text="${info.database}"></strong> · ADMIN</p>
  <form data-as-form><div class="app-creation-grid">
    <label class="app-field"><span th:text="#{accountSetup.name}"></span><input class="form-control" data-as-name required pattern="[A-Z][A-Z0-9_]{2,29}" maxlength="30" autocomplete="off"></label>
    <label class="app-field"><span th:text="#{accountSetup.preset}"></span><select class="form-select" data-as-preset><option value="LIMITED" th:text="#{accountSetup.limited}"></option><option value="WORKSPACE" th:text="#{accountSetup.workspace}"></option><option value="AI_WORKSPACE" th:text="#{accountSetup.aiWorkspace}"></option></select></label>
  </div><p th:text="#{accountSetup.scope}"></p><button class="btn app-btn app-btn-secondary" type="submit" data-as-preview th:text="#{accountSetup.preview}"></button> <button class="btn app-btn app-btn-quiet" type="button" data-as-status th:text="#{accountSetup.status}"></button></form>
  <section data-as-review hidden><h2 th:text="#{accountSetup.review}"></h2><pre class="app-preview-source" data-code-language="sql" data-as-sql></pre>
    <p class="app-alert" th:text="#{accountSetup.warning}"></p>
    <label class="app-field"><span th:text="#{accountSetup.password}"></span><input type="password" class="form-control" data-as-password autocomplete="new-password" minlength="12" maxlength="30"></label>
    <p th:text="#{accountSetup.passwordHelp}"></p>
    <label class="app-check-field"><input type="checkbox" data-as-consent><span th:text="#{accountSetup.consent}"></span></label>
    <button type="button" class="btn app-btn app-btn-primary" data-as-create disabled th:text="#{accountSetup.create}"></button>
    <button type="button" class="btn app-btn app-btn-secondary" data-as-configure hidden disabled th:text="#{accountSetup.configure}"></button>
  </section><p role="status" aria-live="polite" data-as-message></p><pre class="app-preview-source" data-code-language="json" data-as-result></pre>
</section>
<section th:if="${accountAdmin}" class="app-card app-module-card" data-privilege-setup>
 <h2 th:text="#{accountGrant.title}"></h2><p th:text="#{accountGrant.help}"></p>
 <input type="hidden" data-ag-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
 <label class="app-field"><span th:text="#{accountGrant.name}"></span><input class="form-control" data-ag-name maxlength="30" autocomplete="off"></label>
 <label class="app-field"><span th:text="#{accountGrant.operation}"></span><select class="form-select" data-ag-operation><option value="TEXT">Oracle Text · CTXSYS.CTX_DDL</option><option value="VPD">VPD · SYS.DBMS_RLS</option><option value="DDS_POLICY" th:text="#{ddsManage.policyPreset}"></option><option value="DDS">DDS · CREATE DATA GRANT + SELECT DBA_DATA_ROLES</option><option value="FUNCTION">Function · CREATE PROCEDURE</option><option value="TABLE">CREATE TABLE</option><option value="CREDENTIAL">Credential · DBMS_CLOUD</option><option value="PROFILE">Profile · DBMS_CLOUD_AI</option><option value="AGENT">Agent · DBMS_CLOUD_AI_AGENT</option><option value="JOB">CREATE JOB</option><option value="GRAPH">CREATE PROPERTY GRAPH + CREATE VIEW</option><option value="RDF" th:text="#{adminHelp.rdf}">Oracle RDF · 소유 스키마 객체 생성</option></select></label>
 <button type="button" class="btn app-btn app-btn-secondary" data-ag-preview th:text="#{accountGrant.preview}"></button>
 <section data-ag-review hidden><pre class="app-preview-source" data-code-language="sql" data-ag-sql></pre><label class="app-check-field"><input type="checkbox" data-ag-consent><span th:text="#{accountGrant.consent}"></span></label><button type="button" class="btn app-btn app-btn-primary" data-ag-apply disabled th:text="#{accountGrant.apply}"></button></section>
 <p role="status" aria-live="polite" data-ag-message></p><pre class="app-preview-source" data-code-language="json" data-ag-result></pre>
</section>
<section th:if="${accountAdmin}" id="ai-network" class="app-card app-module-card" data-ai-network>
 <h2 th:text="#{aiNetwork.title}"></h2><p th:text="#{aiNetwork.remedy}"></p><p class="app-alert" th:text="#{aiNetwork.scope}"></p>
 <input type="hidden" data-an-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
 <div class="app-creation-grid"><label class="app-field"><span th:text="#{aiNetwork.name}"></span><input class="form-control" data-an-name maxlength="30" autocomplete="off"></label>
 <label class="app-field"><span th:text="#{aiNetwork.provider}"></span><select class="form-select" data-an-provider><option value="OPENAI">OpenAI · api.openai.com</option><option value="COHERE">Cohere · api.cohere.ai</option><option value="ANTHROPIC">Anthropic · api.anthropic.com</option><option value="GOOGLE">Google · generativelanguage.googleapis.com</option></select></label></div>
 <button type="button" class="btn app-btn app-btn-secondary" data-an-status th:text="#{aiNetwork.status}"></button>
 <button type="button" class="btn app-btn app-btn-secondary" data-an-preview th:text="#{aiNetwork.preview}"></button>
 <section data-an-review hidden><pre class="app-preview-source" data-code-language="sql" data-an-sql></pre><label class="app-check-field"><input type="checkbox" data-an-consent><span th:text="#{aiNetwork.consent}"></span></label><button type="button" class="btn app-btn app-btn-primary" data-an-apply disabled th:text="#{aiNetwork.apply}"></button></section>
 <p role="status" aria-live="polite" data-an-message></p><pre class="app-preview-source" data-code-language="json" data-an-result></pre>
</section></main></div><script type="module" th:src="@{/js/account-setup.mjs}"></script><script type="module" th:src="@{/js/account-grants.mjs}"></script><script type="module" th:src="@{/js/ai-network-setup.mjs}"></script></body></html>
