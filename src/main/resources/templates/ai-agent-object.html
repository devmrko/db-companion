<!DOCTYPE html><html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Select AI Agent')}"></head><body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside>
<div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header><main class="app-content">
<a th:href="@{/ai-agents/objects(kind=${objectKind})}" class="app-back-link" th:text="${'← ' + objectKind}"></a>
<div class="app-page-heading"><h1 th:text="${objectName}"></h1><button th:if="${objectEditable}" type="button" class="btn app-btn app-btn-secondary" th:attr="data-ai-create=${objectKind},data-source=${objectName}" th:text="#{creation.clone}">복제</button></div>
<div th:if="${loadError}" class="app-alert is-error" th:text="${loadError}"></div><th:block th:if="${component != null}"><section th:replace="~{fragments/agent :: component(${component}, ${objectKind})}"></section></th:block>
</main></div><th:block th:replace="~{fragments/catalog-preview :: modal}"></th:block>
<th:block th:if="${component != null and objectEditable}"><th:block th:replace="~{fragments/object-editor :: editor}"></th:block><th:block th:replace="~{fragments/object-history :: history}"></th:block><th:block th:replace="~{fragments/ai-creation :: dialog}"></th:block></th:block><script type="module" th:src="@{/js/object-editor.mjs}"></script></body></html>
