<!DOCTYPE html><html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head(#{credentialEdit.title})}"></head>
<body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header><main class="app-content" data-credential-edit>
<h1 th:text="#{credentialEdit.title}"></h1><p><strong th:text="${info.database}"></strong> · <strong th:text="${info.username}"></strong></p><p class="app-alert" th:text="#{credentialEdit.help}"></p>
<input type="hidden" data-ce-csrf th:value="${_csrf.token}" th:attr="data-csrf-header=${_csrf.headerName}">
<section class="app-card app-module-card">
<label class="app-field"><span th:text="#{credentialEdit.name}"></span><input class="form-control" data-ce-name maxlength="128" autocomplete="off"></label>
<label class="app-field"><span th:text="#{credentialEdit.attribute}"></span><select class="form-select" data-ce-attribute><option value="PASSWORD" th:text="#{credentialEdit.password}"></option><option value="USERNAME" th:text="#{credentialEdit.username}"></option></select></label>
<div class="app-editor-actions"><button type="button" class="btn app-btn app-btn-secondary" data-ce-preview th:text="#{credentialEdit.preview}"></button><button type="button" class="btn app-btn app-btn-secondary" data-ce-restore th:text="#{credentialEdit.restore}"></button></div>
<section data-ce-review hidden><p data-ce-purpose></p><pre class="app-preview-source" data-code-language="sql" data-ce-sql></pre>
<label class="app-field"><span data-ce-value-label th:text="#{credentialEdit.value}"></span><input class="form-control" data-ce-value type="password" autocomplete="new-password" maxlength="4000"></label>
<label class="app-check-field"><input type="checkbox" data-ce-consent><span th:text="#{credentialEdit.consent}"></span></label>
<button type="button" class="btn app-btn app-btn-primary" data-ce-apply disabled th:text="#{credentialEdit.apply}"></button></section>
<p role="status" aria-live="polite" data-ce-message></p><pre class="app-preview-source" data-ce-result></pre>
<a th:href="@{/db/credentials}" th:text="#{credentialEdit.usages}"></a> · <a th:href="@{/db/admin-help}" th:text="#{adminHelp.title}"></a>
</section></main></div><script type="module" th:src="@{/js/credential-edit.mjs}"></script></body></html>
