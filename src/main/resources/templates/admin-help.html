<!DOCTYPE html><html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head(#{adminHelp.title})}"></head>
<body class="app-shell"><aside th:replace="~{fragments/common :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments/common :: topbar}"></header><main class="app-content">
<h1 th:text="#{adminHelp.title}"></h1><p><strong th:text="${info.database}"></strong> · <strong th:text="${info.username}"></strong></p>
<p class="app-alert" th:text="#{adminHelp.scope}"></p><p th:text="#{adminHelp.steps}"></p>
<section class="app-module-card"><h2 th:text="#{adminHelp.quota}"></h2><p th:text="#{adminHelp.quotaHelp}"></p><a th:href="@{/db/scott-demo}" th:text="#{scottSetup.status}"></a></section>
<section class="app-module-card" th:each="item : ${instructions}"><h2 th:text="${#messages.msg('adminHelp.' + item.key)}"></h2><pre class="app-preview-source" data-code-language="sql" th:text="${item.sql}"></pre></section>
<section class="app-module-card"><h2 th:text="#{adminHelp.adminOnly}"></h2><p th:text="#{adminHelp.adminOnlyHelp}"></p><a th:href="@{/db/accounts}" th:text="#{accountSetup.title}"></a></section>
<p th:text="#{adminHelp.other}"></p>
<a href="https://docs.oracle.com/en/cloud/paas/autonomous-database/serverless/adbsb/select-ai-manage-profiles.html" target="_blank" rel="noopener noreferrer">Oracle Select AI</a>
</main></div></body></html>
